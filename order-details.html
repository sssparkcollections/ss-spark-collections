<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Order Details | SS Spark Collections
    </title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

    <style>

        /* =====================================================
           PAGE
        ===================================================== */

        .order-details-page {
            padding: 28px;
            max-width: 1480px;
            margin: 0 auto;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 25px;
            margin-bottom: 24px;
        }

        .header-left {
            min-width: 0;
        }

        .back-btn {
            border: 1px solid #e2e2e2;
            background: #fff;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            color: #444;
        }

        .back-btn:hover {
            background: #fafafa;
        }

        .details-title {
            margin: 20px 0 6px;
            font-size: 28px;
            color: #182235;
        }

        .details-subtitle {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .order-highlight {
            color: #c82c78;
            font-weight: 700;
        }


        /* =====================================================
           STATUS CARDS
        ===================================================== */

        .status-cards {
            display: grid;
            grid-template-columns: repeat(2, minmax(240px, 1fr));
            gap: 14px;
            min-width: 520px;
        }

        .status-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 17px 18px;

            display: flex;
            align-items: center;
            gap: 14px;

            box-shadow:
                0 4px 18px rgba(0,0,0,.04);
        }

        .status-card.order-status-card {
            border-color: #f2cde1;
        }

        .status-card.payment-status-card {
            border-color: #d4ebdc;
        }

        .status-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
            flex-shrink: 0;
        }

        .order-status-card .status-icon {
            background: #fff0f7;
        }

        .payment-status-card .status-icon {
            background: #eefaf2;
        }

        .status-card-content {
            flex: 1;
            min-width: 0;
        }

        .status-card-label {
            font-size: 12px;
            color: #777;
            margin-bottom: 5px;
        }

        .status-card-value {
            font-size: 17px;
            font-weight: 700;
        }

        .order-status-card .status-card-value {
            color: #c82c78;
        }

        .payment-status-card .status-card-value {
            color: #23834a;
        }


        /* =====================================================
           MAIN GRID
        ===================================================== */

        .details-grid {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr);
            gap: 20px;
        }

        .details-left,
        .details-right {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }


        /* =====================================================
           CARD
        ===================================================== */

        .details-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 16px;
            overflow: hidden;

            box-shadow:
                0 4px 18px rgba(0,0,0,.04);
        }

        .card-header {
            padding: 18px 20px;
            border-bottom: 1px solid #eee;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .card-title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;

            background: #fff0f7;
            color: #d52c7d;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 16px;
        }

        .card-header h2 {
            margin: 0;
            font-size: 17px;
            color: #182235;
        }

        .card-header-count {
            font-size: 13px;
            color: #888;
        }

        .card-body {
            padding: 20px;
        }


        /* =====================================================
           ORDER ITEMS
        ===================================================== */

        .items-table-wrapper {
            overflow-x: auto;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        .items-table th {
            text-align: left;
            padding: 12px;

            background: #fafbfd;

            color: #667085;

            font-size: 11px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: .04em;
        }

        .items-table td {
            padding: 15px 12px;

            border-top: 1px solid #f0f0f0;

            font-size: 14px;
            vertical-align: middle;
        }

        .product-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .product-image {
            width: 58px;
            height: 58px;

            border-radius: 10px;

            object-fit: cover;

            border: 1px solid #eee;

            background: #fafafa;

            flex-shrink: 0;
        }

        .product-placeholder {
            width: 58px;
            height: 58px;

            border-radius: 10px;

            background: #fff0f7;

            color: #d52c7d;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;

            border: 1px solid #f5d7e7;

            flex-shrink: 0;
        }

        .product-name {
            font-weight: 600;
            color: #252b37;
        }

        .product-id {
            margin-top: 4px;
            font-size: 11px;
            color: #999;
        }

        .item-price,
        .item-subtotal {
            white-space: nowrap;
        }

        .item-subtotal {
            font-weight: 700;
        }


        /* =====================================================
           TOTALS
        ===================================================== */

        .totals {
            margin-top: 20px;
            padding-top: 18px;

            border-top: 1px solid #eee;

            max-width: 430px;
            margin-left: auto;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;

            padding: 7px 0;

            font-size: 14px;
            color: #667085;
        }

        .total-row strong {
            color: #333;
        }

        .total-row.discount {
            color: #23904d;
        }

        .total-row.discount strong {
            color: #23904d;
        }

        .total-row.grand-total {
            margin-top: 9px;
            padding: 14px 14px;

            border-radius: 10px;

            background: #fff0f7;

            font-size: 18px;
            font-weight: 700;

            color: #c82c78;
        }

        .total-row.grand-total strong {
            color: #c82c78;
        }


        /* =====================================================
           CUSTOMER
        ===================================================== */

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;

            padding: 11px 0;

            border-bottom: 1px solid #f1f1f1;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #888;
            font-size: 13px;
        }

        .info-value {
            text-align: right;

            font-size: 14px;
            font-weight: 600;

            color: #333;

            word-break: break-word;
        }


        /* =====================================================
           ADDRESS
        ===================================================== */

        .address-box {
            background: #fafafa;

            border-radius: 12px;

            padding: 17px;

            line-height: 1.7;

            font-size: 14px;

            color: #555;
        }

        .address-name {
            font-weight: 700;
            color: #222;
            margin-bottom: 6px;
        }


        /* =====================================================
           UPDATE ORDER
        ===================================================== */

        .form-group {
            display: flex;
            flex-direction: column;

            gap: 7px;

            margin-bottom: 18px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 700;
            color: #667085;
        }

        .form-group select {
            width: 100%;
            height: 44px;

            padding: 0 12px;

            border: 1px solid #ddd;
            border-radius: 10px;

            background: #fff;

            font-size: 14px;

            outline: none;
        }

        .form-group select:focus {
            border-color: #d78bb5;

            box-shadow:
                0 0 0 3px rgba(215,139,181,.10);
        }

        .save-btn {
            width: 100%;
            height: 45px;

            border: none;
            border-radius: 10px;

            background: #d52c7d;

            color: #fff;

            font-weight: 700;

            cursor: pointer;

            transition:
                background .15s ease,
                transform .15s ease;
        }

        .save-btn:hover {
            background: #bc236d;
        }

        .save-btn:active {
            transform: translateY(1px);
        }

        .save-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }


        /* =====================================================
           STATUS BADGES
        ===================================================== */

        .status-badge,
        .payment-badge {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding: 7px 12px;

            border-radius: 999px;

            font-size: 11px;
            font-weight: 700;

            white-space: nowrap;
        }

        .status-pending {
            background: #fff5d6;
            color: #9a7100;
        }

        .status-confirmed {
            background: #e9f1ff;
            color: #3b68b8;
        }

        .status-processing {
            background: #eee9ff;
            color: #6b4fc4;
        }

        .status-shipped {
            background: #e6f5ff;
            color: #1973a5;
        }

        .status-delivered {
            background: #e8f7ed;
            color: #2c8a4b;
        }

        .status-cancelled {
            background: #ffe9e9;
            color: #c14b4b;
        }

        .status-returned {
            background: #f2eaea;
            color: #805858;
        }

        .payment-pending {
            background: #fff5d6;
            color: #9a7100;
        }

        .payment-paid {
            background: #e8f7ed;
            color: #2c8a4b;
        }

        .payment-failed {
            background: #ffe9e9;
            color: #c14b4b;
        }

        .payment-refunded {
            background: #eee9ff;
            color: #6b4fc4;
        }

        .payment-partially_refunded {
            background: #e9f1ff;
            color: #3b68b8;
        }


        /* =====================================================
           ORDER INFORMATION
        ===================================================== */

        .info-card-value {
            font-weight: 600;
        }


        /* =====================================================
           PAGE MESSAGE
        ===================================================== */

        .page-message {
            background: #fff;

            border: 1px solid #eee;

            border-radius: 16px;

            padding: 60px 20px;

            text-align: center;

            color: #777;
        }

        .page-message strong {
            display: block;

            color: #444;

            margin-bottom: 8px;

            font-size: 17px;
        }


        /* =====================================================
           TOAST
        ===================================================== */

        .toast-container {
            position: fixed;

            right: 24px;
            bottom: 24px;

            z-index: 9999;

            display: flex;
            flex-direction: column;

            gap: 12px;

            pointer-events: none;
        }

        .toast {
            width: min(390px, calc(100vw - 40px));

            background: #fff;

            border-radius: 14px;

            padding: 15px 16px;

            display: flex;
            align-items: flex-start;

            gap: 12px;

            box-shadow:
                0 12px 35px rgba(0,0,0,.14);

            border: 1px solid #eee;

            pointer-events: auto;

            animation:
                toastIn .25s ease forwards;
        }

        .toast.success {
            border-left: 4px solid #2b9b59;
        }

        .toast.error {
            border-left: 4px solid #d44747;
        }

        .toast-icon {
            width: 34px;
            height: 34px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            font-weight: 700;
        }

        .toast.success .toast-icon {
            background: #e8f7ed;
            color: #25834a;
        }

        .toast.error .toast-icon {
            background: #ffe9e9;
            color: #c14b4b;
        }

        .toast-content {
            flex: 1;
        }

        .toast-title {
            font-size: 14px;
            font-weight: 700;
            color: #222;

            margin-bottom: 3px;
        }

        .toast-message {
            font-size: 12px;
            color: #777;
            line-height: 1.5;
        }

        .toast-close {
            border: none;
            background: transparent;

            color: #999;

            cursor: pointer;

            font-size: 17px;

            line-height: 1;
        }

        @keyframes toastIn {

            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 650px) {

            .details-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .status-cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 100%;
        min-width: 0;
        gap: 10px;
    }

    .status-card {
        padding: 13px 12px;
        gap: 9px;
    }

    .status-icon {
        width: 36px;
        height: 36px;
        font-size: 16px;
    }

    .status-card-label {
        font-size: 10px;
    }

    .status-card-value {
        font-size: 14px;
    }
            .details-grid {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 650px) {

            .order-details-page {
                padding: 18px;
            }

            .status-cards {
                grid-template-columns: 1fr;
            }

            .details-title {
                margin: 14px 0 5px;
        font-size: 22px;
            }

            .details-subtitle {
        font-size: 11px;
    }

            .card-header,
            .card-body {
                padding: 16px;
            }

            .info-row {
                align-items: flex-start;
                flex-direction: column;
                gap: 4px;
            }

            .info-value {
                text-align: left;
            }

            .totals {
                max-width: none;
            }

            .toast-container {
                right: 12px;
                bottom: 12px;
                left: 12px;
            }

        }

        @media (max-width: 650px) {

    .topbar {
        gap: 14px;
        padding-bottom: 14px;
    }

    .topbar > div:first-child {
        min-width: 0;
    }

    .topbar h1 {
        margin-bottom: 0;
    }

    .admin-profile {
        flex-shrink: 0;
    }

}

/* =========================================
   SHIPMENT & TRACKING
========================================= */

.shipment-card {
    margin-top: 24px;
}


/* =========================================
   SHIPMENT SUMMARY
========================================= */

.shipment-summary {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;

    padding: 20px 22px;

    margin-top: 20px;

    border: 1px solid #f0dfe7;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #fff8fb 0%,
            #ffffff 100%
        );

}


.shipment-summary-main {

    display: flex;

    align-items: center;

    gap: 14px;

    min-width: 0;
}


.shipment-courier-icon {

    width: 46px;
    height: 46px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 12px;

    background: #fff0f5;

    font-size: 23px;
}


.shipment-summary-label,
.shipment-package-label {

    font-size: 10px;

    font-weight: 700;

    letter-spacing: .08em;

    color: #9b7889;

}


.shipment-summary-courier {

    margin-top: 3px;

    font-size: 17px;

    font-weight: 700;

    color: #24161d;
}


.shipment-summary-method {

    margin-top: 3px;

    font-size: 12px;

    color: #8c7180;
}


.shipment-package {

    display: flex;

    align-items: center;

    gap: 9px;

    padding: 8px 13px;

    border-radius: 10px;

    background: #ffffff;

    border: 1px solid #eee1e7;

}


.shipment-package-icon {

    font-size: 18px;
}


.shipment-package strong {

    display: block;

    margin-top: 2px;

    font-size: 15px;

    color: #24161d;
}


/* =========================================
   JOURNEY
========================================= */

.shipment-journey {

    margin-top: 20px;

    padding: 20px 22px;

    border: 1px solid #eee4e9;

    border-radius: 14px;

    background: #ffffff;
}


.shipment-section-title {

    margin-bottom: 15px;

    font-size: 10px;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: .08em;

    color: #9b7889;
}


.shipment-step {

    position: relative;

    display: flex;

    gap: 13px;

    min-height: 56px;
}


.shipment-step:not(.shipment-step-last)::after {

    content: "";

    position: absolute;

    left: 10px;

    top: 25px;

    bottom: -5px;

    width: 1px;

    background: #eadde4;
}


.shipment-step-marker {

    position: relative;

    z-index: 1;

    width: 21px;
    height: 21px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 50%;

    border: 1px solid #dfcbd5;

    background: #ffffff;

    color: #9b7889;

    font-size: 10px;

    font-weight: 700;
}


.shipment-step.completed .shipment-step-marker {

    border-color: #d6336c;

    background: #d6336c;

    color: #ffffff;
}


.shipment-step.current
.shipment-step-marker {

    border-color: #d6336c;

    background: #fff0f5;

    color: #d6336c;
}


.shipment-step-content {

    padding-bottom: 14px;
}


.shipment-step-title {

    font-size: 13px;

    font-weight: 700;

    color: #34242c;
}


.shipment-step-date {

    margin-top: 3px;

    font-size: 12px;

    color: #927b86;
}


/* =========================================
   TRACKING
========================================= */

.shipment-tracking-box {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;

    margin-top: 20px;

    padding: 17px 20px;

    border: 1px solid #eee4e9;

    border-radius: 14px;

    background: #fcfafb;
}


.shipment-tracking-box
.shipment-section-title {

    margin-bottom: 5px;
}


.shipment-tracking-number {

    font-size: 15px;

    font-weight: 700;

    color: #24161d;

    word-break: break-all;
}


.shipment-track-btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

    flex-shrink: 0;

    padding: 9px 14px;

    border-radius: 9px;

    background: #d6336c;

    color: #ffffff;

    text-decoration: none;

    font-size: 12px;

    font-weight: 600;

    transition: all .2s ease;
}


.shipment-track-btn:hover {

    background: #c52d61;

    transform: translateY(-1px);
}


.shipment-track-btn span {

    font-size: 14px;
}


/* =========================================
   NOTES
========================================= */

.shipment-notes-box {

    margin-top: 14px;

    padding: 16px 20px;

    border-left: 3px solid #d6336c;

    border-radius: 0 10px 10px 0;

    background: #fff8fb;
}


.shipment-notes-box
.shipment-section-title {

    margin-bottom: 6px;
}


.shipment-notes-text {

    font-size: 13px;

    line-height: 1.6;

    color: #5d4752;

    word-break: break-word;
}


/* =========================================
   EMPTY STATE
========================================= */

.shipment-empty {

    text-align: center;

    padding: 42px 20px;
}


.shipment-empty-icon {

    margin-bottom: 10px;

    font-size: 34px;
}


.shipment-empty h3 {

    margin: 0 0 6px;

    font-size: 17px;

    color: #34242c;
}


.shipment-empty p {

    margin: 0;

    color: #8b7680;

    font-size: 13px;
}


/* =========================================
   SHIPMENT STATUS BADGES
========================================= */

.shipment-status-badge {

    border: 1px solid transparent;
}


.shipment-status-pending {

    background: #fff5df;

    color: #9a6800;
}


.shipment-status-transit {

    background: #eef5ff;

    color: #2764a5;
}


.shipment-status-out {

    background: #fff0e6;

    color: #b45b16;
}


.shipment-status-delivered {

    background: #eaf8f0;

    color: #23784b;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

    .shipment-card .card-header {

        align-items: flex-start;

        flex-direction: column;
    }


    .shipment-summary {

        align-items: flex-start;

        flex-direction: column;
    }


    .shipment-package {

        width: 100%;

        box-sizing: border-box;
    }


    .shipment-tracking-box {

        align-items: flex-start;

        flex-direction: column;
    }


    .shipment-track-btn {

        width: 100%;

        box-sizing: border-box;
    }

}

/* =====================================================
   SHIPMENT MODAL
===================================================== */

.shipment-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 22px;
    width: 100%;
}


.edit-shipment-btn {
    border: none;
    border-radius: 10px;

    background: #d6336c;
    color: #ffffff;

    padding: 11px 18px;

    font-size: 13px;
    font-weight: 600;

    cursor: pointer;

    transition: all 0.2s ease;
}


.edit-shipment-btn:hover {
    background: #c52d61;
    transform: translateY(-1px);
    box-shadow:
        0 6px 16px rgba(214, 51, 108, 0.20);
}


/* ================= MODAL ================= */

.shipment-modal {
    position: fixed;
    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    z-index: 9999;
}


.shipment-modal.active {
    display: flex;
}


.shipment-modal-overlay {
    position: absolute;
    inset: 0;

    background: rgba(40, 20, 30, 0.48);

    backdrop-filter: blur(3px);
}


.shipment-modal-box {
    position: relative;

    width: min(680px, 100%);

    max-height: 90vh;

    overflow-y: auto;

    background: #ffffff;

    border-radius: 18px;

    box-shadow:
        0 25px 70px rgba(40, 20, 30, 0.25);

    z-index: 1;
}


/* ================= HEADER ================= */

.shipment-modal-header {
    display: flex;

    align-items: flex-start;
    justify-content: space-between;

    gap: 20px;

    padding: 24px 26px;

    border-bottom: 1px solid #f0e3e9;
}


.shipment-modal-eyebrow {
    margin-bottom: 5px;

    font-size: 10px;
    font-weight: 700;

    letter-spacing: 1.5px;

    color: #c52d61;
}


.shipment-modal-header h2 {
    margin: 0;

    font-size: 22px;

    color: #3f3035;
}


.shipment-modal-header p {
    margin: 5px 0 0;

    font-size: 13px;

    color: #9a7d8d;
}


.shipment-modal-close {
    width: 36px;
    height: 36px;

    border: none;

    border-radius: 50%;

    background: #fff1f6;

    color: #c52d61;

    font-size: 24px;

    line-height: 1;

    cursor: pointer;
}


/* ================= BODY ================= */

.shipment-modal-body {
    padding: 25px 26px;
}


.shipment-form-group {
    margin-bottom: 18px;
}


.shipment-form-group label {
    display: block;

    margin-bottom: 7px;

    font-size: 12px;

    font-weight: 600;

    color: #4c3042;
}


.shipment-form-group input,
.shipment-form-group select,
.shipment-form-group textarea {
    width: 100%;

    box-sizing: border-box;

    border: 1px solid #ead9e2;

    border-radius: 10px;

    background: #ffffff;

    color: #3f3035;

    padding: 11px 12px;

    font-family: inherit;

    font-size: 13px;

    outline: none;

    transition: border-color 0.2s ease,
                box-shadow 0.2s ease;
}


.shipment-form-group input:focus,
.shipment-form-group select:focus,
.shipment-form-group textarea:focus {
    border-color: #d6336c;

    box-shadow:
        0 0 0 3px rgba(214, 51, 108, 0.10);
}


.shipment-form-group textarea {
    resize: vertical;

    min-height: 90px;
}


.shipment-form-grid {
    display: grid;

    grid-template-columns: repeat(2, minmax(0, 1fr));

    gap: 0 16px;
}


/* ================= FOOTER ================= */

.shipment-modal-footer {
    display: flex;

    justify-content: flex-end;

    gap: 10px;

    padding: 18px 26px;

    border-top: 1px solid #f0e3e9;

    background: #fffafd;

    border-radius: 0 0 18px 18px;
}


.shipment-cancel-btn,
.shipment-save-btn {
    border-radius: 10px;

    padding: 11px 18px;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;
}


.shipment-cancel-btn {
    border: 1px solid #ead9e2;

    background: #ffffff;

    color: #6d5361;
}


.shipment-save-btn {
    border: none;

    background: #d6336c;

    color: #ffffff;
}


.shipment-save-btn:hover {
    background: #c52d61;
}


.shipment-save-btn:disabled {
    opacity: 0.6;

    cursor: not-allowed;
}


/* ================= MOBILE ================= */

@media (max-width: 700px) {

    .shipment-modal {
        padding: 10px;
    }


    .shipment-modal-box {
        max-height: 94vh;

        border-radius: 15px;
    }


    .shipment-modal-header {
        padding: 20px;
    }


    .shipment-modal-body {
        padding: 20px;
    }


    .shipment-form-grid {
        grid-template-columns: 1fr;
    }


    .shipment-modal-footer {
        padding: 15px 20px;
    }


    .shipment-cancel-btn,
    .shipment-save-btn {
        flex: 1;
    }


    .shipment-actions {
        justify-content: stretch;
    }


    .edit-shipment-btn {
        width: 100%;
    }

}

/* =====================================================
   SUCCESS TOAST
===================================================== */

.success-toast {
    display: flex;
    align-items: center;
    gap: 10px;

    padding: 12px 16px;

    border-radius: 10px;

    background: #e8f8ef;
    color: #18794e;

    border: 1px solid #bce8ce;

    font-size: 13px;
    font-weight: 600;

    box-shadow: 0 8px 24px rgba(0,0,0,0.08);

    animation: toastIn 0.25s ease;
}

.toast-icon {
    width: 22px;
    height: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #27ae60;
    color: white;

    font-size: 12px;
    font-weight: 700;
}

.toast-hide {
    opacity: 0;
    transform: translateY(-5px);
    transition: all 0.3s ease;
}

@keyframes toastIn {

    from {
        opacity: 0;
        transform: translateY(-5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

    font-weight: 700;

.invoice-btn-icon {

    align-items: center;

    font-size: 16px;

    line-height: 1;

<script type="module">

import { supabase } from "./supabase-client.js";


/* =====================================================
   STATE
===================================================== */

let order = null;

let orderItems = [];

let orderStatuses = [];

let workflowOptions = [];

let paymentStatuses = [];

let shipment = null;

let shipmentCouriers = [];

let shipmentStatuses = [];

let shippingMethods = [];


/* =====================================================
   ORDER ID
===================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const orderId =
    urlParams.get("id");


/* =====================================================
   DOM
===================================================== */

const pageContent =
    document.getElementById(
        "pageContent"
    );

const orderTitle =
    document.getElementById(
        "orderTitle"
    );

const orderDate =
    document.getElementById(
        "orderDate"
    );

const headerOrderStatus =
    document.getElementById(
        "headerOrderStatus"
    );

const headerPaymentStatus =
    document.getElementById(
        "headerPaymentStatus"
    );

const orderAlertStack =
    document.getElementById("orderAlertStack");


/* =====================================================
   INITIAL LOAD
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        if (!orderId) {

            showError(
                "Order ID is missing."
            );

            return;

        }


        await loadParameters();

        await loadOrder();

    }
);


/* =====================================================
   LOAD PARAMETERS
===================================================== */

/* =====================================================
   LOAD PARAMETERS
===================================================== */

async function loadParameters() {

    try {

        const {
            data,
            error
        } =
            await supabase
                .from("parameter_values")
                .select(`
                    id,
                    parameter_group,
                    parameter_code,
                    parameter_name,
                    display_order,
                    is_active
                `)
                .eq(
                    "is_active",
                    true
                )
                .in(
                    "parameter_group",
                    [
                        "ORDER_STATUS",
                        "PAYMENT_STATUS",
                        "SHIPMENT_COURIER",
                        "SHIPMENT_STATUS",
                        "SHIPPING_METHOD"
                    ]
                )
                .order(
                    "display_order",
                    {
                        ascending: true
                    }
                );


        if (error) {
            throw error;
        }


        const parameters =
            data || [];


        orderStatuses =
            parameters.filter(
                item =>
                    item.parameter_group ===
                    "ORDER_STATUS"
            );


        paymentStatuses =
            parameters.filter(
                item =>
                    item.parameter_group ===
                    "PAYMENT_STATUS"
            );


        shipmentCouriers =
            parameters.filter(
                item =>
                    item.parameter_group ===
                    "SHIPMENT_COURIER"
            );


        shipmentStatuses =
            parameters.filter(
                item =>
                    item.parameter_group ===
                    "SHIPMENT_STATUS"
            );


        shippingMethods =
            parameters.filter(
                item =>
                    item.parameter_group ===
                    "SHIPPING_METHOD"
            );

    }

    catch (error) {

        console.error(
            "Parameter loading error:",
            error
        );

    }

}


/* =====================================================
   LOAD ORDER
===================================================== */

async function loadOrder() {

    try {

        const {
            data,
            error
        } =
            await supabase
                .from("orders")
                .select(`
                    id,
                    user_id,
                    order_number,
                    status,
                    payment_status,
                    subtotal,
                    discount_amount,
                    shipping_amount,
                    total_amount,
                    shipping_address,
                    created_at,
                    updated_at
                `)
                .eq(
                    "id",
                    orderId
                )
                .maybeSingle();


        if (error) {
            throw error;
        }


        if (!data) {

            showError(
                "Order not found."
            );

            return;

        }


        order = data;

        await loadWorkflowOptions();

        shipment = await loadShipment();


        await loadOrderItems();

        await loadCustomer();


        renderPage();

    }

    catch (error) {

        console.error(
            "Order loading error:",
            error
        );


        showError(
            error.message ||
            "Unable to load order."
        );

    }

}


/* =====================================================
   LOAD ORDER ITEMS
===================================================== */

async function loadOrderItems() {

    const {
        data,
        error
    } =
        await supabase
            .from("order_items")
            .select(`
                id,
                product_id,
                product_name,
                product_price,
                quantity,
                subtotal,
                created_at
            `)
            .eq(
                "order_id",
                orderId
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {
        throw error;
    }


    orderItems =
        data || [];


    /*
     * Fetch primary product images only when
     * actual product_id values exist.
     */

    await loadProductImages();

}

async function loadShipment() {

    const { data, error } = await supabase
        .from("order_shipments")
        .select(`
            id,
            order_id,
            courier_name,
            tracking_number,
            tracking_url,
            shipped_date,
            expected_delivery_date,
            delivered_date,
            shipment_status,
            shipping_method,
            package_count,
            notes
        `)
        .eq("order_id", orderId)
        .maybeSingle();

    if (error) {
        console.error("Shipment load error:", error);
        return null;
    }

    return data;
}


/* =====================================================
   LOAD PRODUCT IMAGES
===================================================== */

async function loadProductImages() {

    const productIds = [
        ...new Set(
            orderItems
                .map(
                    item =>
                        item.product_id
                )
                .filter(Boolean)
        )
    ];


    if (!productIds.length) {
        return;
    }


    const {
        data,
        error
    } =
        await supabase
            .from("product_images")
            .select(`
                product_id,
                image_url,
                is_primary,
                display_order
            `)
            .in(
                "product_id",
                productIds
            )
            .order(
                "is_primary",
                {
                    ascending: false
                }
            )
            .order(
                "display_order",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "Product image loading error:",
            error
        );

        return;

    }


    const imageMap =
        new Map();


    (data || []).forEach(
        image => {

            if (
                !imageMap.has(
                    image.product_id
                )
            ) {

                imageMap.set(
                    image.product_id,
                    image.image_url
                );

            }

        }
    );


    orderItems =
        orderItems.map(
            item => ({

                ...item,

                image_url:
                    imageMap.get(
                        item.product_id
                    ) || null

            })
        );

}


/* =====================================================
   LOAD CUSTOMER
===================================================== */

async function loadCustomer() {

    if (!order.user_id) {
        return;
    }


    const {
        data,
        error
    } =
        await supabase
            .from("profiles")
            .select(`
                id,
                full_name,
                email,
                phone
            `)
            .eq(
                "id",
                order.user_id
            )
            .maybeSingle();


    if (error) {

        console.error(
            "Customer loading error:",
            error
        );

        return;

    }


    order.customer =
        data || null;

}


/* =====================================================
   RENDER PAGE
===================================================== */

function renderPage() {

    orderTitle.textContent =
        `Order #${order.order_number}`;


    orderDate.innerHTML =
        `Created on <strong>${formatDateTime(
            order.created_at
        )}</strong>`;


    renderHeaderStatus();

    renderContent();

    renderShipment();

}


/* =====================================================
   SHIPMENT EVENTS
===================================================== */

document.addEventListener(
    "click",
    event => {

        if (
            event.target.closest(
                "#editShipmentBtn"
            )
        ) {

            openShipmentModal();

        }


        if (
            event.target.closest(
                "#closeShipmentModalBtn"
            )
        ) {

            closeShipmentModal();

        }


        if (
            event.target.closest(
                "#cancelShipmentBtn"
            )
        ) {

            closeShipmentModal();

        }


        if (
            event.target.closest(
                ".shipment-modal-overlay"
            )
        ) {

            closeShipmentModal();

        }


        if (
            event.target.closest(
                "#saveShipmentBtn"
            )
        ) {

            saveShipment();

        }

    }
);


/* ESC closes modal */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeShipmentModal();

        }

    }
);

/* =====================================================
   RENDER SHIPMENT
===================================================== */

function renderShipment() {

    const content =
        document.getElementById(
            "shipmentContent"
        );

    const badge =
        document.getElementById(
            "shipmentStatusBadge"
        );


    if (!content || !badge) {
        return;
    }


    /* =================================================
       NO SHIPMENT
    ================================================= */

    if (!shipment) {

        badge.textContent =
            "Not Shipped";


        content.innerHTML = `

            <div class="shipment-empty">

                <div class="shipment-empty-icon">
                    🚚
                </div>

                <h3>
                    Shipment not created
                </h3>

                <p>
                    Tracking information will appear here
                    once the order has been shipped.
                </p>

            </div>

        `;

        return;
    }


    /* =================================================
       HELPERS
    ================================================= */

    const safe =
        value =>
            escapeHtml(
                value ?? "—"
            );


    const formatDate =
        value => {

            if (!value) {
                return "—";
            }

            return new Date(
                value
            ).toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            );

        };


    const status =
        (
            shipment.shipment_status ||
            ""
        ).toLowerCase();


    const isDelivered =
        status.includes(
            "deliver"
        );


    const isOutForDelivery =
        status.includes(
            "out"
        );


    const isInTransit =
        status.includes(
            "transit"
        );


    const hasShippedDate =
        Boolean(
            shipment.shipped_date
        );


    const hasExpectedDate =
        Boolean(
            shipment.expected_delivery_date
        );


    const hasDeliveredDate =
        Boolean(
            shipment.delivered_date
        );


    /* =================================================
       STATUS BADGE
    ================================================= */

    badge.textContent =
        shipment.shipment_status ||
        "Shipped";


    badge.className =
        "status-badge shipment-status-badge";


    if (isDelivered) {

        badge.classList.add(
            "shipment-status-delivered"
        );

    }
    else if (
        isOutForDelivery
    ) {

        badge.classList.add(
            "shipment-status-out"
        );

    }
    else if (
        isInTransit
    ) {

        badge.classList.add(
            "shipment-status-transit"
        );

    }
    else {

        badge.classList.add(
            "shipment-status-pending"
        );

    }


    /* =================================================
       TRACK BUTTON
    ================================================= */

    const trackingButton =
        shipment.tracking_url
            ? `
                <a
                    href="${safe(
                        shipment.tracking_url
                    )}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="shipment-track-btn"
                >
                    Track Shipment
                    <span>↗</span>
                </a>
            `
            : "";


    /* =================================================
       RENDER
    ================================================= */

    content.innerHTML = `

        <!-- SUMMARY -->

        <div class="shipment-summary">

            <div class="shipment-summary-main">

                <div class="shipment-courier-icon">
                    🚚
                </div>

                <div>

                    <div class="shipment-summary-label">
                        SHIPMENT PARTNER
                    </div>

                    <div class="shipment-summary-courier">
                        ${safe(
                            shipment.courier_name
                        )}
                    </div>

                    <div class="shipment-summary-method">
                        ${safe(
                            shipment.shipping_method
                        )}
                    </div>

                </div>

            </div>


            <div class="shipment-package">

                <span class="shipment-package-icon">
                    📦
                </span>

                <div>

                    <div class="shipment-package-label">
                        PACKAGE
                    </div>

                    <strong>
                        ${safe(
                            shipment.package_count || 1
                        )}
                    </strong>

                </div>

            </div>

        </div>


        <!-- JOURNEY -->

        <div class="shipment-journey">

            <div class="shipment-section-title">
                Shipment Journey
            </div>


            <!-- SHIPPED -->

            <div class="
                shipment-step
                ${hasShippedDate ? "completed" : ""}
            ">

                <div class="shipment-step-marker">
                    ${hasShippedDate ? "✓" : "1"}
                </div>

                <div class="shipment-step-content">

                    <div class="shipment-step-title">
                        Shipment Shipped
                    </div>

                    <div class="shipment-step-date">
                        ${
                            hasShippedDate
                                ? formatDate(
                                    shipment.shipped_date
                                )
                                : "Not shipped yet"
                        }
                    </div>

                </div>

            </div>


            <!-- EXPECTED -->

            <div class="
                shipment-step
                shipment-step-middle
                ${
                    hasExpectedDate
                        ? "current"
                        : ""
                }
            ">

                <div class="shipment-step-marker">

                    ${
                        hasExpectedDate
                            ? "•"
                            : "2"
                    }

                </div>

                <div class="shipment-step-content">

                    <div class="shipment-step-title">
                        Expected Delivery
                    </div>

                    <div class="shipment-step-date">

                        ${
                            hasExpectedDate
                                ? formatDate(
                                    shipment.expected_delivery_date
                                )
                                : "Date not available"
                        }

                    </div>

                </div>

            </div>


            <!-- DELIVERED -->

            <div class="
                shipment-step
                shipment-step-last
                ${
                    hasDeliveredDate ||
                    isDelivered
                        ? "completed"
                        : ""
                }
            ">

                <div class="shipment-step-marker">

                    ${
                        hasDeliveredDate ||
                        isDelivered
                            ? "✓"
                            : "3"
                    }

                </div>

                <div class="shipment-step-content">

                    <div class="shipment-step-title">
                        Delivered
                    </div>

                    <div class="shipment-step-date">

                        ${
                            hasDeliveredDate
                                ? formatDate(
                                    shipment.delivered_date
                                )
                                : "Not delivered yet"
                        }

                    </div>

                </div>

            </div>

        </div>


        <!-- TRACKING -->

        <div class="shipment-tracking-box">

            <div>

                <div class="shipment-section-title">
                    Tracking Number
                </div>

                <div class="shipment-tracking-number">

                    ${
                        shipment.tracking_number
                            ? safe(
                                shipment.tracking_number
                            )
                            : "Not available"
                    }

                </div>

            </div>


            ${trackingButton}

        </div>


        <!-- NOTES -->

        ${
            shipment.notes
                ? `

                    <div class="shipment-notes-box">

                        <div class="shipment-section-title">
                            Shipment Notes
                        </div>

                        <div class="shipment-notes-text">
                            ${safe(
                                shipment.notes
                            )}
                        </div>

                    </div>

                `
                : ""
        }

    `;

}

/* =====================================================
   SHIPMENT PARAMETER OPTIONS
===================================================== */

function renderShipmentOptions(
    items,
    selectedValue = "",
    placeholder = "Select"
) {

    return `
        <option value="">
            ${placeholder}
        </option>

        ${(items || [])
            .map(item => {

                const selected =
                    item.parameter_name === selectedValue
                        ? "selected"
                        : "";

                return `
                    <option
                        value="${escapeHtml(item.parameter_name)}"
                        ${selected}
                    >
                        ${escapeHtml(item.parameter_name)}
                    </option>
                `;

            })
            .join("")}
    `;
}


/* =====================================================
   OPEN SHIPMENT MODAL
===================================================== */

function openShipmentModal() {

    const modal =
        document.getElementById(
            "shipmentModal"
        );

    if (!modal) {
        return;
    }


    document.getElementById(
        "shipmentCourier"
    ).innerHTML =
        renderShipmentOptions(
            shipmentCouriers,
            shipment?.courier_name || "",
            "Select courier"
        );


    document.getElementById(
        "shipmentStatus"
    ).innerHTML =
        renderShipmentOptions(
            shipmentStatuses,
            shipment?.shipment_status || "",
            "Select shipment status"
        );


    document.getElementById("shipmentStatus").onchange = applyShipmentFieldRules;


    document.getElementById(
        "shippingMethod"
    ).innerHTML =
        renderShipmentOptions(
            shippingMethods,
            shipment?.shipping_method || "",
            "Select shipping method"
        );


    document.getElementById(
        "trackingNumber"
    ).value =
        shipment?.tracking_number || "";


    document.getElementById(
        "trackingUrl"
    ).value =
        shipment?.tracking_url || "";


    document.getElementById(
        "shippedDate"
    ).value =
        shipment?.shipped_date
            ? shipment.shipped_date.substring(0, 10)
            : "";


    document.getElementById(
        "expectedDeliveryDate"
    ).value =
        shipment?.expected_delivery_date
            ? shipment.expected_delivery_date.substring(0, 10)
            : "";


    document.getElementById(
        "deliveredDate"
    ).value =
        shipment?.delivered_date
            ? shipment.delivered_date.substring(0, 10)
            : "";

    applyShipmentFieldRules();


    document.getElementById(
        "packageCount"
    ).value =
        shipment?.package_count || 1;


    document.getElementById(
        "shipmentNotes"
    ).value =
        shipment?.notes || "";


    modal.classList.add("active");

    modal.setAttribute(
        "aria-hidden",
        "false"
    );
}


function applyShipmentFieldRules() {

    const currentStatus = String(order?.status || "").toLowerCase();
    const shipmentStatus = String(
        document.getElementById("shipmentStatus")?.value || ""
    ).toLowerCase();

    const deliveredVisible =
        currentStatus === "delivered";

    const shipmentVisible = [
        "shipped",
        "out_for_delivery",
        "delivered",
        "delivery_failed"
    ].includes(currentStatus);

    const deliveredGroup =
        document.getElementById("deliveredDate")?.closest(".shipment-form-group");
    const shippedGroup =
        document.getElementById("shippedDate")?.closest(".shipment-form-group");
    const expectedGroup =
        document.getElementById("expectedDeliveryDate")?.closest(".shipment-form-group");

    if (deliveredGroup) deliveredGroup.style.display = deliveredVisible ? "" : "none";
    if (shippedGroup) shippedGroup.style.display = shipmentVisible ? "" : "none";
    if (expectedGroup) expectedGroup.style.display = shipmentVisible ? "" : "none";
}


/* =====================================================
   CLOSE SHIPMENT MODAL
===================================================== */

function closeShipmentModal() {

    const modal =
        document.getElementById(
            "shipmentModal"
        );

    if (!modal) {
        return;
    }


    modal.classList.remove(
        "active"
    );

    modal.setAttribute(
        "aria-hidden",
        "true"
    );
}


/* =====================================================
   SAVE SHIPMENT
===================================================== */

async function saveShipment() {

    const saveButton =
        document.getElementById(
            "saveShipmentBtn"
        );

    const saveText =
        document.getElementById(
            "saveShipmentText"
        );


    try {

        saveButton.disabled = true;

        saveText.textContent =
            "Saving...";


        const courier =
            document.getElementById(
                "shipmentCourier"
            ).value.trim();


        const status =
            document.getElementById(
                "shipmentStatus"
            ).value.trim();


        const shippingMethod =
            document.getElementById(
                "shippingMethod"
            ).value.trim();


        const trackingNumber =
            document.getElementById(
                "trackingNumber"
            ).value.trim();


        const trackingUrl =
            document.getElementById(
                "trackingUrl"
            ).value.trim();


        const shippedDate =
            document.getElementById(
                "shippedDate"
            ).value || null;


        const expectedDeliveryDate =
            document.getElementById(
                "expectedDeliveryDate"
            ).value || null;


        const deliveredDate =
            document.getElementById(
                "deliveredDate"
            ).value || null;


        const packageCount =
            Number(
                document.getElementById(
                    "packageCount"
                ).value
            ) || 1;


        const notes =
            document.getElementById(
                "shipmentNotes"
            ).value.trim();


        if (!courier) {

            showError(
                "Please select a courier."
            );

            return;
        }


        if (!status) {

            showError(
                "Please select shipment status."
            );

            return;
        }


        if (!shippingMethod) {

            showError(
                "Please select shipping method."
            );

            return;
        }


        if (
            trackingUrl &&
            !/^https?:\/\//i.test(
                trackingUrl
            )
        ) {

            showError(
                "Tracking URL must start with http:// or https://."
            );

            return;
        }


        if (packageCount < 1) {

            showError(
                "Package count must be at least 1."
            );

            return;
        }


        const shipmentData = {

            order_id:
                orderId,

            courier_name:
                courier,

            tracking_number:
                trackingNumber || null,

            tracking_url:
                trackingUrl || null,

            shipped_date:
                shippedDate,

            expected_delivery_date:
                expectedDeliveryDate,

            delivered_date:
                deliveredDate,

            shipment_status:
                status,

            shipping_method:
                shippingMethod,

            package_count:
                packageCount,

            notes:
                notes || null

        };


        let result;


        /* =============================================
           UPDATE EXISTING SHIPMENT
        ============================================= */

        if (shipment?.id) {

            result =
                await supabase
                    .from(
                        "order_shipments"
                    )
                    .update(
                        shipmentData
                    )
                    .eq(
                        "id",
                        shipment.id
                    );

        }


        /* =============================================
           CREATE NEW SHIPMENT
        ============================================= */

        else {

            result =
                await supabase
                    .from(
                        "order_shipments"
                    )
                    .insert(
                        shipmentData
                    );

        }


        if (result.error) {
            throw result.error;
        }


        /* Reload shipment */

        shipment =
            await loadShipment();


        /* Refresh shipment UI */

        renderShipment();


        closeShipmentModal();


        showSuccess(
            "Shipment details saved successfully."
        );

    }

    catch (error) {

        console.error(
            "Shipment save error:",
            error
        );


        showError(
            error.message ||
            "Unable to save shipment details."
        );

    }

    finally {

        saveButton.disabled = false;

        saveText.textContent =
            "Save Shipment";

    }

}

function renderStatusOptions() {

            <option value="${escapeHtml(current)}" selected>

            </option>
        `;

    const transitionOptions = (workflowOptions || [])
        .filter(option =>
            String(option.to_status_code || "").toLowerCase() !==
            String(current || "").toLowerCase()
        )
        .map(option => {
            const target = orderStatuses.find(
                status =>
                    String(status.parameter_code).toLowerCase() ===
                    String(option.to_status_code).toLowerCase()
            );

            if (!target) return "";

            return `

                    data-transition-id="${escapeHtml(option.transition_id)}">
                    ${escapeHtml(option.action_name || target.parameter_name)} → ${escapeHtml(target.parameter_name)}
                </option>
            `;
        })
        .join("");

    return currentOption + transitionOptions;
}

/* =====================================================
   SAVE STATUS
===================================================== */

async function saveStatus() {

    const saveButton = document.getElementById("saveStatusBtn");
    const newStatus = document.getElementById("orderStatus")?.value || "";
    const newPaymentStatus = document.getElementById("paymentStatus")?.value || "";

    if (!newStatus) {
        showToast("error", "Update failed", "Please select an order status.");
        return;
    }

    if (!newPaymentStatus) {
        showToast("error", "Update failed", "Please select a payment status.");
        return;
    }

    const statusChanged = newStatus !== order.status;
    const paymentChanged = newPaymentStatus !== order.payment_status;

    if (!statusChanged && !paymentChanged) {
        showToast("success", "No changes", "The order already has these statuses.");
        return;
    }

    let transition = null;
    const detailValue = getStatusDetailValue();
    const remarksValue = getStatusRemarksValue();

    if (statusChanged) {

        transition = (workflowOptions || []).find(option =>
            String(option.to_status_code).toLowerCase() ===
            String(newStatus).toLowerCase()
        );

        if (!transition) {
            showToast(
                "error",
                "Invalid workflow transition",
                "That status is not a configured next step for this order."
            );
            return;
        }

        if (String(newStatus).toLowerCase() === "cancelled" && !detailValue) {
            showToast(
                "error",
                "Cancellation reason required",
                "Please enter a cancellation reason before cancelling the order."
            );
            return;
        }

        if (
            String(newStatus).toLowerCase() === "delivered" &&
            !document.getElementById("statusDetailDeliveredDate")?.value
        ) {
            showToast(
                "error",
                "Delivered date required",
                "Please select the delivered date before marking the order as delivered."
            );
            return;
        }
    }

    saveButton.disabled = true;
    saveButton.textContent = "Saving...";

    try {

        let workflowResult = null;

        if (statusChanged) {

            const targetStatus = String(newStatus).toLowerCase();
            const metadata = {
                source: "order-details",
                status_details: {}
            };

            if (detailValue) {
                const key =
                    targetStatus === "cancelled"
                        ? "cancellation_reason"
                        : targetStatus === "delivery_failed"
                            ? "failure_reason"
                            : targetStatus === "return_requested"
                                ? "return_reason"
                                : targetStatus === "return_rejected"
                                    ? "rejection_reason"
                                    : targetStatus === "refund_initiated"
                                        ? "refund_reference_or_note"
                                        : "status_note";

                metadata.status_details[key] = detailValue;
            }

            if (targetStatus === "delivered") {
                metadata.status_details.delivered_date =
                    document.getElementById("statusDetailDeliveredDate").value;
            }

            const { data, error } = await supabase.rpc(
                "admin_change_order_status",
                {
                    p_order_id: orderId,
                    p_transition_id: transition.transition_id,
                    p_remarks: remarksValue || null,
                    p_metadata: metadata
                }
            );

            if (error) throw error;
            workflowResult = data;
        }

        if (paymentChanged) {

            const { data, error } = await supabase
                .from("orders")
                .update({
                    payment_status: newPaymentStatus,
                    updated_at: new Date().toISOString()
                })
                .eq("id", orderId)
                .select("id,payment_status,updated_at")
                .single();

            if (error) throw error;

            order.payment_status = data.payment_status;
            order.updated_at = data.updated_at;
        }

        if (workflowResult) {

            order.status = workflowResult.to_status || newStatus;
            order.updated_at = new Date().toISOString();

            if (String(newStatus).toLowerCase() === "delivered") {

                const deliveredDate =
                    document.getElementById("statusDetailDeliveredDate").value;

                if (shipment?.id) {
                    const { error: shipmentError } =
                        await supabase
                            .from("order_shipments")
                            .update({ delivered_date: deliveredDate })
                            .eq("id", shipment.id);

                    if (shipmentError) throw shipmentError;
                    shipment = await loadShipment();
                }
            }
        }

        await loadWorkflowOptions();
        renderPage();

        showToast(
            "success",
            "Order updated successfully!",
            statusChanged && paymentChanged
                ? "Order workflow and payment status have been updated."
                : statusChanged
                    ? "Order status moved through the configured workflow."
                    : "Payment status has been updated."
        );

    }
    catch (error) {

        console.error("Order update error:", error);

        showToast(
            "error",
            "Unable to update order",
            error.message || "Something went wrong while saving the order."
        );

    }
    finally {

        const button = document.getElementById("saveStatusBtn");

        if (button) {
            button.disabled = false;
            button.textContent = "Save Changes";
        }

    }
}


/* =====================================================
   TOAST
===================================================== */

function showToast(
    type,
    title,
    message
) {

    const toast =
        document.createElement(
            "div"
        );


    toast.className =
        `toast ${type}`;


    const icon =
        type === "success"
            ? "✓"
            : "!";


    toast.innerHTML = `

        <div class="toast-icon">
            ${icon}
        </div>


        <div class="toast-content">

            <div class="toast-title">
                ${escapeHtml(title)}
            </div>

            <div class="toast-message">
                ${escapeHtml(message)}
            </div>

        </div>


        <button
            type="button"
            class="toast-close"
            aria-label="Close"
        >
            ×
        </button>

    `;


    orderAlertStack.appendChild(toast);


    const closeButton =
        toast.querySelector(
            ".toast-close"
        );


    closeButton.addEventListener(
        "click",
        () => {

            toast.remove();

        }
    );


    setTimeout(
        () => {

            if (
                toast.isConnected
            ) {

                toast.remove();

            }

        },
        4500
    );

}


/* =====================================================
   ORDER STATUS HISTORY
===================================================== */
const orderHistoryModal = document.getElementById("orderHistoryModal");
const orderHistoryOverlay = document.getElementById("orderHistoryOverlay");
const closeOrderHistoryBtn = document.getElementById("closeOrderHistoryBtn");
const closeOrderHistoryAction = document.getElementById("closeOrderHistoryAction");

async function openOrderHistory() {
    if (!orderHistoryModal || !orderId) return;
    orderHistoryModal.classList.add("active");
    orderHistoryModal.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    const body = document.getElementById("orderHistoryBody");
    const current = document.getElementById("orderHistoryCurrentStatus");
    const count = document.getElementById("orderHistoryCount");
    const subtitle = document.getElementById("orderHistoryModalSubtitle");
    if (current) current.textContent = getParameterName(orderStatuses, order?.status) || "—";
    if (subtitle) subtitle.textContent = `${order?.order_number ? "Order " + order.order_number + " · " : ""}Complete status transition timeline`;
    if (count) count.textContent = "";
    if (body) body.innerHTML = `<div class="order-history-loading">Loading status history...</div>`;
    try {
        const { data, error } = await supabase.from("order_status_history").select(`id,order_id,from_status,to_status,action_code,action_name,changed_by,remarks,metadata,changed_at`).eq("order_id", orderId).order("changed_at", { ascending: true });
        if (error) throw error;
        const history = data || [];
        if (count) count.textContent = `${history.length} ${history.length === 1 ? "event" : "events"}`;
        if (!history.length) {
            if (body) body.innerHTML = `<div class="order-history-empty"><div><div class="order-history-empty-icon">◷</div><strong style="display:block;color:#51404a;margin-bottom:5px;">No status history yet</strong><span>No workflow transitions have been recorded for this order.</span></div></div>`;
            return;
        }
        if (body) body.innerHTML = `<div class="order-history-timeline">${history.map((event,index)=>renderOrderHistoryEvent(event,index===history.length-1)).join("")}</div>`;
    } catch (error) {
        console.error("Order status history load error:", error);
        if (body) body.innerHTML = `<div class="order-history-error"><div><div class="order-history-empty-icon">!</div><strong style="display:block;color:#8b3d4e;margin-bottom:5px;">Unable to load history</strong><span>${escapeHtml(error.message || "Something went wrong while loading status history.")}</span></div></div>`;
    }
}

function renderOrderHistoryEvent(event, latest) {
    const fromStatus = event.from_status ? getParameterName(orderStatuses,event.from_status) : "Order created";
    const toStatus = getParameterName(orderStatuses,event.to_status);
    const actionName = event.action_name || event.action_code || "Status updated";
    const details = getOrderHistoryDetails(event.metadata);
    return `<div class="order-history-event ${latest ? "latest" : ""}"><div class="order-history-dot">${latest ? "✓" : "•"}</div><div class="order-history-event-card"><div class="order-history-event-top"><div class="order-history-transition">${event.from_status ? `<span class="order-history-status from">${escapeHtml(fromStatus)}</span><span class="order-history-arrow">→</span>` : ""}<span class="order-history-status to">${escapeHtml(toStatus)}</span></div><div class="order-history-time">${escapeHtml(formatDateTime(event.changed_at))}</div></div><div class="order-history-action">${escapeHtml(actionName)}</div>${event.remarks ? `<div class="order-history-remarks">${escapeHtml(event.remarks)}</div>` : ""}${details ? `<div class="order-history-details">${details}</div>` : ""}${event.changed_by ? `<div style="margin-top:8px;color:#a08994;font-size:9px;">Changed by · ${escapeHtml(event.changed_by)}</div>` : ""}</div></div>`;
}

function getOrderHistoryDetails(metadata) {
    if (!metadata || typeof metadata !== "object") return "";
    const statusDetails = metadata.status_details && typeof metadata.status_details === "object" ? metadata.status_details : {};
    const labels = {cancellation_reason:"Cancellation reason",failure_reason:"Failure reason",return_reason:"Return reason",rejection_reason:"Rejection reason",refund_reference_or_note:"Refund reference / note",delivered_date:"Delivered date",status_note:"Status note"};
    return Object.entries(statusDetails).filter(([,value])=>value!==null&&value!==undefined&&String(value).trim()!=="").map(([key,value])=>`<div class="order-history-detail"><div class="order-history-detail-label">${escapeHtml(labels[key] || formatHistoryKey(key))}</div><div class="order-history-detail-value">${escapeHtml(typeof value === "object" ? JSON.stringify(value) : value)}</div></div>`).join("");
}
function formatHistoryKey(key){return String(key||"").replace(/[_-]+/g," ").replace(/\b\w/g,letter=>letter.toUpperCase());}
function closeOrderHistory(){
    if(!orderHistoryModal)return;

    // Move focus out of the modal BEFORE hiding it from assistive technology.
    // This prevents the browser accessibility warning when the Close button is focused.
    const trigger = document.getElementById("viewOrderHistoryBtn");
    const activeElement = document.activeElement;
    if (activeElement && orderHistoryModal.contains(activeElement)) {
        if (trigger && typeof trigger.focus === "function") {
            trigger.focus({ preventScroll: true });
        } else {
            activeElement.blur();
        }
    }

    orderHistoryModal.classList.remove("active");
    orderHistoryModal.setAttribute("aria-hidden","true");
    document.body.style.overflow="";
}
closeOrderHistoryBtn?.addEventListener("click",closeOrderHistoryBtn ? closeOrderHistory : null);
closeOrderHistoryAction?.addEventListener("click",closeOrderHistory);
orderHistoryOverlay?.addEventListener("click",closeOrderHistory);
document.addEventListener("keydown",event=>{if(event.key==="Escape"&&orderHistoryModal?.classList.contains("active"))closeOrderHistory();});

/* =====================================================
   TOTAL QUANTITY
===================================================== */

function getTotalQuantity() {

    return orderItems.reduce(
        (
            total,
            item
        ) =>
            total +
            Number(
                item.quantity || 0
            ),
        0
    );

}


/* =====================================================
   PARAMETER NAME
===================================================== */

function getParameterName(
    list,
    code
) {

    const parameter =
        list.find(
            item =>
                item.parameter_code ===
                code
        );


    return parameter
        ? parameter.parameter_name
        : code || "-";

}


/* =====================================================
   DATE TIME
===================================================== */

function formatDateTime(
    value
) {

    if (!value) {
        return "-";
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "-";

    }


    return date.toLocaleString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =====================================================
   MONEY
===================================================== */

function formatMoney(
    value
) {

    return Number(
        value || 0
    ).toLocaleString(
        "en-IN",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );

}


/* =====================================================
   SAFE CLASS
===================================================== */

function safeClass(
    value
) {

    return String(
        value || ""
    )
        .toLowerCase()
        .replace(
            /[^a-z0-9_-]/g,
            ""
        );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}

/* =====================================================
   SUCCESS
===================================================== */

function showSuccess(message) {
    showOrderAlert(message, "success", "Done");
}

function showOrderAlert(message, type = "success", title = "") {
    if (!orderAlertStack) return;

    const alertEl = document.createElement("div");
    alertEl.className = `order-alert ${type}`;
    const icon = type === "error" ? "!" : "✓";

    alertEl.innerHTML = `
        <div class="order-alert-icon">${icon}</div>
        <div class="order-alert-content">
            <div class="order-alert-title">${escapeHtml(title || (type === "error" ? "Something went wrong" : "Done"))}</div>
            <div class="order-alert-message">${escapeHtml(message)}</div>
        </div>
    `;

    orderAlertStack.appendChild(alertEl);
    setTimeout(() => {
        alertEl.style.opacity = "0";
        alertEl.style.transform = "translateY(10px)";
        alertEl.style.transition = "opacity .18s ease, transform .18s ease";
        setTimeout(() => alertEl.remove(), 200);
    }, 2800);
}

function showError(
    message
) {

    pageContent.innerHTML = `

        <div class="page-message">

            <strong>
                Unable to load order
            </strong>

            ${escapeHtml(
                message
            )}

            <div
                style="
                    margin-top:18px;
                "
            >

                <button
                    type="button"
                    class="back-btn"
                    id="errorBackBtn"
                >
                    ← Back to Orders
                </button>

            </div>

        </div>

    `;


    document
        .getElementById(
            "errorBackBtn"
        )
        ?.addEventListener(
            "click",
            () => {

                window.location.href =
                    "orders.html";

            }
        );

}
