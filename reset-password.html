<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | SS Spark Collections</title><link rel="stylesheet" href="style.css">
<style>
body.auth-body{background:radial-gradient(circle at 8% 10%,rgba(217,77,125,.13),transparent 30%),radial-gradient(circle at 92% 90%,rgba(199,154,69,.10),transparent 28%),linear-gradient(135deg,#fff9fb,#fff 48%,#fff7fa)}
.reset-wrapper{min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}.reset-card{width:min(100%,450px);background:rgba(255,255,255,.97);border:1px solid rgba(122,35,68,.14);border-radius:28px;box-shadow:0 24px 70px rgba(92,23,51,.14);padding:30px;box-sizing:border-box}
.reset-logo{width:70px;height:70px;margin:0 auto 15px;display:grid;place-items:center;border-radius:22px;background:linear-gradient(145deg,#fff4f8,#fff);border:1px solid rgba(217,77,125,.12);box-shadow:0 10px 28px rgba(122,35,68,.10)}.reset-logo img{width:56px;height:56px;object-fit:contain}
.reset-card h1{text-align:center;margin:0;color:#5d1733;font-size:25px}.reset-subtitle{text-align:center;color:#876b75;font-size:12px;line-height:1.55;margin:7px 0 22px}.reset-group{margin-bottom:14px}.reset-group label{display:block;color:#603342;font-size:12px;font-weight:700;margin-bottom:7px}.reset-group input{width:100%;min-height:46px;box-sizing:border-box;border:1px solid rgba(122,35,68,.15);border-radius:13px;background:#fff;color:#38242c;padding:0 13px}.reset-group input:focus{outline:none;border-color:rgba(217,77,125,.58);box-shadow:0 0 0 4px rgba(217,77,125,.09)}
.reset-btn{width:100%;min-height:48px;border:0;border-radius:14px;background:linear-gradient(135deg,#d94d7d,#9b2d56);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 12px 24px rgba(155,45,86,.20)}.reset-status{text-align:center;color:#6f4d5d;font-size:11px;line-height:1.5;margin:11px 0 0}.reset-note{text-align:center;margin:17px 0 0;color:#9a818d;font-size:10px;line-height:1.5}.reset-back{display:block;text-align:center;margin-top:14px;color:#7a2344;text-decoration:none;font-size:11px;font-weight:800}@media(max-width:500px){.reset-wrapper{padding:10px}.reset-card{padding:22px 17px;border-radius:20px}}
</style>
<style id="reset-final-polish">
.recovery-alert-stack{position:fixed;top:16px;right:16px;z-index:1000;width:min(360px,calc(100vw - 32px));display:flex;flex-direction:column;gap:8px;pointer-events:none}.recovery-alert{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;border:1px solid rgba(122,35,68,.13);border-radius:14px;background:rgba(255,255,255,.97);box-shadow:0 14px 34px rgba(92,23,51,.15);color:#603342;backdrop-filter:blur(10px);animation:recoveryAlertIn .18s ease both}.recovery-alert.is-hiding{opacity:0;transform:translateY(-5px);transition:opacity .18s ease,transform .18s ease}.recovery-alert-icon{width:28px;height:28px;flex:0 0 28px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(135deg,#d94d7d,#9b2d56);color:#fff;font-size:12px;font-weight:900}.recovery-alert.error .recovery-alert-icon{background:linear-gradient(135deg,#b84b68,#7a2344)}.recovery-alert.info .recovery-alert-icon{background:linear-gradient(135deg,#c79a45,#9b7330)}.recovery-alert-content{min-width:0}.recovery-alert-title{font-size:10.5px;font-weight:800;color:#7a2344;margin-bottom:2px}.recovery-alert-message{font-size:10px;line-height:1.45;color:#806773}@keyframes recoveryAlertIn{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:translateY(0)}}
.recovery-password-wrap{position:relative}.recovery-password-wrap input{padding-right:48px}.recovery-password-toggle{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:34px;height:34px;padding:0;border:0;border-radius:9px;background:transparent;color:#8d6876;display:grid;place-items:center;cursor:pointer}.recovery-password-toggle:hover{background:#fff1f6;color:#7a2344}.reset-btn:disabled{opacity:.65;cursor:not-allowed}
@media(max-width:500px){.recovery-alert-stack{top:9px;right:9px;width:calc(100vw - 18px)}.recovery-alert{padding:9px 10px;border-radius:12px}.recovery-alert-message{font-size:9.5px}.reset-card{padding:20px 15px}}
@media(max-width:360px){.recovery-alert-stack{top:6px;right:6px;width:calc(100vw - 12px)}.reset-wrapper{padding:7px}.reset-card{padding:18px 13px;border-radius:18px}.reset-card h1{font-size:22px}.reset-subtitle{font-size:11px;margin-bottom:17px}.reset-group{margin-bottom:11px}.reset-group input{min-height:43px;font-size:12px}}
</style>

</head><body class="auth-body">
<div id="recoveryAlertStack" class="recovery-alert-stack" aria-live="polite" aria-atomic="false"></div>
<div class="reset-wrapper"><main class="reset-card"><div class="reset-logo"><img src="assets/logo.png" alt="SS Spark Collections"></div>
<h1>Create a new password</h1><p class="reset-subtitle">Your reset link is verified. Choose a new password for your SS Spark Collections account.</p>
<form id="recoveryPasswordForm"><div class="reset-group"><label for="recoveryPassword">New Password</label><div class="recovery-password-wrap"><input type="password" id="recoveryPassword" placeholder="Enter new password" autocomplete="new-password" minlength="6" required><button type="button" class="recovery-password-toggle" data-target="recoveryPassword" aria-label="Show password">◉</button></div></div>
<div class="reset-group"><label for="recoveryPasswordConfirm">Confirm New Password</label><div class="recovery-password-wrap"><input type="password" id="recoveryPasswordConfirm" placeholder="Re-enter new password" autocomplete="new-password" minlength="6" required><button type="button" class="recovery-password-toggle" data-target="recoveryPasswordConfirm" aria-label="Show password">◉</button></div></div>
<button type="submit" class="reset-btn">Update Password</button><p id="recoveryStatus" class="reset-status"></p></form>
<p class="reset-note">Your password is securely handled by Supabase Auth.</p><a href="login.html" class="reset-back">← Back to Login</a></main></div>
<script>
document.querySelectorAll(".recovery-password-toggle").forEach((button)=>{button.addEventListener("click",()=>{const input=document.getElementById(button.dataset.target);if(!input)return;const visible=input.type==="text";input.type=visible?"password":"text";button.textContent=visible?"◉":"○";button.setAttribute("aria-label",visible?"Show password":"Hide password");});});
</script>
<script type="module" src="auth.js"></script></body></html>
