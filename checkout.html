<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | SS Spark Collections</title>
<link rel="stylesheet" href="style.css">
<style>
:root{
  --pink:#d6336c;--pink2:#b92357;--rose:#8f294f;--ink:#542238;
  --muted:#987080;--border:#edd9e2;--soft:#fff7fa;--green:#218a57;
  --gold:#b78635;--shadow:0 18px 50px rgba(83,35,52,.08)
}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none}
.checkout-page{min-height:100vh;background:linear-gradient(180deg,#fff9fb 0,#fff 38%)}
.checkout-wrap{width:min(1120px,92%);margin:auto;padding:26px 0 70px}
.checkout-top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--rose);font:700 12px Arial}
.checkout-brand{display:flex;align-items:center;justify-content:center}
.checkout-brand img{width:88px;height:auto;object-fit:contain}
.secure{font:700 9px Arial;color:var(--muted);display:flex;gap:6px;align-items:center}
.checkout-title{text-align:center;margin:4px 0 25px}
.checkout-title .eyebrow{margin:0 0 7px;color:var(--pink);font:700 9px Arial;letter-spacing:3px}
.checkout-title h1{margin:0;font:500 clamp(31px,5vw,45px)/1.05 Georgia,serif;color:var(--ink)}
.steps{display:flex;align-items:center;justify-content:center;margin:0 auto 28px;max-width:570px}
.step{display:flex;align-items:center;gap:7px;color:#b49aa6;font:700 9px Arial;white-space:nowrap}
.step .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid #dfccd5;background:#fff;color:#a98d9a;font-size:9px}
.step.active{color:var(--pink)}
.step.active .num{background:var(--pink);border-color:var(--pink);color:#fff}
.step.done{color:var(--green)}
.step.done .num{background:#eef9f3;border-color:#b9e3cc;color:var(--green)}
.step-line{height:1px;width:70px;background:#e7d9df;margin:0 10px}
.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.72fr);gap:25px;align-items:start}
.card{background:#fff;border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow)}
.panel{padding:23px}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:20px}
.panel-head h2{margin:0;font:500 23px Georgia,serif}
.panel-head p{margin:5px 0 0;color:var(--muted);font:10px Arial}
.saved-btn{border:0;background:transparent;color:var(--pink);font:700 9px Arial;text-decoration:underline;text-underline-offset:3px;padding:5px 0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font:700 9px Arial;color:var(--ink)}
.field label span{font-weight:400;color:var(--muted)}
.field input,.field textarea{width:100%;border:1px solid #e5cbd6;border-radius:11px;background:#fff;color:var(--ink);outline:none;padding:0 12px;font:11px Arial;transition:.18s}
.field input{height:43px}
.field textarea{min-height:74px;padding:12px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(214,51,108,.07)}
.save-row{display:flex;align-items:center;gap:8px;margin-top:15px}
.save-row input{accent-color:var(--pink)}
.save-row label{color:var(--muted);font:10px Arial}
.address-actions{display:flex;justify-content:flex-end;margin-top:20px}
.primary{width:100%;height:48px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;font:700 10px Arial;box-shadow:0 11px 25px rgba(214,51,108,.2)}
.primary:disabled{opacity:.55;cursor:not-allowed}
.payment-panel{margin-top:18px;display:none}
.payment-panel.show{display:block}
.payment-list{display:grid;gap:10px}
.payment-option{position:relative;display:flex;align-items:center;gap:12px;padding:15px;border:1px solid #ead7df;border-radius:14px;background:#fff;transition:.18s}
.payment-option.selected{border-color:var(--pink);background:#fff7fa;box-shadow:0 8px 22px rgba(214,51,108,.07)}
.payment-option input{accent-color:var(--pink)}
.payment-copy strong{display:block;font:700 11px Arial}
.payment-copy span{display:block;margin-top:4px;color:var(--muted);font:9px/1.45 Arial}
.payment-badge{margin-left:auto;border-radius:999px;padding:5px 8px;background:#fff0f5;color:var(--pink);font:700 8px Arial}
.cod-fee{display:none;margin-top:10px;padding:11px 12px;border-radius:11px;background:#fff8ed;border:1px solid #f0dfc5;color:#7b5b27;font:700 9px Arial}
.cod-fee.show{display:block}
.saved-addresses{display:none;margin-bottom:18px;padding:13px;border:1px solid #f0dce4;border-radius:15px;background:#fffafd}
.saved-addresses.show{display:block}
.saved-address-item{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid #ead7df;border-radius:12px;background:#fff;margin-top:8px}
.saved-address-item:first-child{margin-top:0}
.saved-address-item input{margin-top:3px;accent-color:var(--pink);width:16px;height:16px;flex:0 0 auto}
.saved-address-item:has(input:checked){border-color:var(--pink);background:#fff7fa;box-shadow:0 6px 18px rgba(214,51,108,.07)}
.saved-address-empty{padding:4px 2px 7px;color:var(--muted);font:10px Arial}
.saved-address-list-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:1px 2px 5px}
.saved-address-list-head strong{font:700 10px Georgia,serif;color:var(--ink)}
.saved-address-list-head span{color:var(--muted);font:8px Arial}
.add-address-btn{width:100%;margin-top:10px;height:39px;border:1px dashed #dca9bc;border-radius:11px;background:#fff;color:var(--pink);font:700 9px Arial;letter-spacing:.1px}
.add-address-btn:hover{background:#fff7fa;border-color:var(--pink)}
.add-address-btn span{font-size:13px;vertical-align:-1px;margin-right:3px}
.saved-address-copy{min-width:0;flex:1}
.saved-address-copy strong{display:block;font:700 10px Arial}
.saved-address-copy p{margin:4px 0 0;color:var(--muted);font:9px/1.45 Arial}
.saved-default{display:inline-block;margin-top:5px;color:var(--green);font:700 7px Arial;letter-spacing:.5px}
.saved-address-actions{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.address-default-btn{border:0;background:#fff0f5;color:var(--pink);border-radius:999px;padding:5px 8px;font:700 7px Arial}
.address-default-btn:hover{background:#ffe3ed}
.address-default-btn:disabled{opacity:.55;cursor:not-allowed}
.address-delete-btn{width:27px;height:27px;display:grid;place-items:center;border:1px solid #efd5df;border-radius:50%;background:#fff;color:#a46b7f;font:700 15px/1 Arial;padding:0;margin-left:auto}
.address-delete-btn:hover{border-color:#d6336c;background:#fff4f7;color:#d6336c}
.address-delete-btn:disabled{opacity:.5;cursor:not-allowed}
@media(hover:none){.address-default-btn:hover{background:#fff0f5}.address-delete-btn:hover{border-color:#efd5df;background:#fff;color:#a46b7f}}
.summary{padding:22px;position:sticky;top:18px}
.summary-payment{margin-top:20px;padding-top:18px;border-top:1px solid var(--border)}
.summary-payment .panel-head{margin-bottom:12px}
.summary-payment .panel-head p{margin:5px 0 0}
.summary-payment .primary{margin-top:14px}

.summary h2{margin:0;font:500 24px Georgia,serif}
.summary-sub{margin:7px 0 18px;color:var(--muted);font:10px Arial}
.summary-items{display:grid;gap:11px;max-height:300px;overflow:auto;padding-right:3px}
.summary-item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center}
.summary-img{width:56px;height:62px;border-radius:10px;overflow:hidden;border:1px solid #f0dfe5;background:#fff4f7}
.summary-img img{width:100%;height:100%;object-fit:cover}
.summary-info strong{display:block;font:700 10px Georgia,serif;line-height:1.3}
.summary-info span{display:block;margin-top:3px;color:var(--muted);font:8px Arial}
.summary-price{font:700 10px Arial;color:var(--pink)}
.summary-divider{height:1px;background:#f0e1e7;margin:17px 0 8px}
.line{display:flex;justify-content:space-between;gap:15px;padding:8px 0;font:10px Arial}
.line span:last-child{font-weight:700}
.discount-line{color:var(--pink)}
.total{margin-top:8px;padding-top:15px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.total span:first-child{font:600 16px Georgia,serif}
.total span:last-child{font:700 20px Arial;color:var(--pink)}
.review-box{display:none;margin-top:24px;padding:24px;border:1px solid var(--border);border-radius:24px;background:linear-gradient(145deg,#fff 0,#fff8fb 100%);box-shadow:var(--shadow)}
.review-box.show{display:block}
.review-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:20px}
.review-eyebrow{margin:0 0 6px;color:var(--pink);font:700 8px Arial;letter-spacing:2px}
.review-title{font:500 23px Georgia,serif;margin:0}
.review-subtitle{margin:6px 0 0;color:var(--muted);font:10px Arial}
.review-check{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#eef9f3;border:1px solid #c6e7d3;color:var(--green);font:700 15px Arial}
.review-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:12px}
.review-section{padding:15px;border:1px solid #ead7df;border-radius:15px;background:#fff}
.review-label{display:block;margin-bottom:8px;color:var(--muted);font:700 8px Arial;letter-spacing:1px;text-transform:uppercase}
.review-address{font:10px/1.6 Arial;color:var(--ink)}
.review-payment-card{display:flex;align-items:center;gap:10px;min-height:58px}
.review-payment-icon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#fff0f5;color:var(--pink);font:700 12px Arial}
.review-payment-card strong{font:700 10px Arial}
.place-order{margin-top:16px}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.trust div{padding:10px 4px;text-align:center;border:1px solid var(--border);border-radius:11px;background:#fffafd}
.trust b{display:block;font:700 8px Arial}
.trust span{display:block;margin-top:3px;color:var(--muted);font:8px Arial}
.loading,.empty{text-align:center;padding:70px 20px;color:var(--muted);font:11px Arial}
.toast{position:fixed;right:20px;bottom:20px;z-index:99;padding:13px 17px;border:1px solid #eccbd8;border-radius:13px;background:#fff;color:var(--ink);box-shadow:0 16px 38px rgba(83,35,52,.16);font:600 11px Arial;opacity:0;transform:translateY(10px);pointer-events:none;transition:.22s}
.toast.show{opacity:1;transform:none}
.summary-items{max-height:330px}
.summary-item-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:6px}
.summary-qty{height:27px;display:flex;align-items:center;border:1px solid #e7cbd6;border-radius:8px;overflow:hidden;background:#fff}
.summary-qty button{width:25px;height:100%;border:0;background:#fff;color:var(--rose);font-size:14px;line-height:1}
.summary-qty button:hover{background:var(--soft);color:var(--pink)}
.summary-qty button:disabled{opacity:.4;cursor:not-allowed}
.summary-qty span{min-width:25px;height:100%;display:grid;place-items:center;border-left:1px solid #f1e0e6;border-right:1px solid #f1e0e6;font:700 9px Arial}
.summary-remove{width:27px;height:27px;border:1px solid #ead7df;border-radius:8px;background:#fff;color:#b4235a;font-size:14px}
.summary-remove:hover{background:#fff0f5}
.coupon{margin:17px 0;padding:14px;border:1px solid #f0dce4;border-radius:16px;background:linear-gradient(145deg,#fff,#fff8fb)}
.coupon-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.coupon-icon{width:29px;height:29px;display:grid;place-items:center;border-radius:9px;background:#fff0f5;color:var(--pink);font-weight:800}
.coupon-head strong{font:600 13px Georgia,serif}
.coupon-head span{display:block;color:var(--muted);font:12px Arial}
.coupon-row{display:grid;grid-template-columns:1fr auto;gap:7px}
.coupon-row input{width:100%;height:40px;border:1px solid #e5cbd6;border-radius:10px;padding:0 11px;outline:none;background:#fff;color:var(--ink);font:10px Arial}
.coupon-row input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(214,51,108,.06)}
.apply{height:40px;border:0;border-radius:10px;background:var(--pink);color:#fff;padding:0 15px;font:700 9px Arial}
.apply:hover{background:var(--pink2)}
.coupon-msg{display:none;margin:7px 2px 0;font:8px/1.45 Arial}
.coupon-msg.show{display:block}.coupon-msg.success{color:var(--green)}.coupon-msg.error{color:#b13c5f}
.coupon-applied{display:none;align-items:center;justify-content:space-between;margin-top:8px;padding:8px 9px;background:#f0fbf5;border:1px solid #d5eee0;border-radius:9px;color:var(--green);font:700 8px Arial}
.coupon-applied.show{display:flex}.coupon-applied button{border:0;background:transparent;color:#a14a68;font-size:13px}
@media(max-width:600px){.coupon-row{grid-template-columns:1fr auto}.summary-items{max-height:280px}.summary-item{grid-template-columns:50px minmax(0,1fr)}.summary-price{grid-column:2}.summary-item-actions{grid-column:2;justify-content:flex-start}}

@media(max-width:850px){.layout{grid-template-columns:1fr}.summary{position:static}}
@media(max-width:600px){
  .checkout-wrap{width:calc(100% - 24px);padding:17px 0 55px}
  .checkout-top{margin-bottom:18px}.checkout-brand img{width:76px}
  .secure{font-size:8px}.steps{margin-bottom:22px}.step-line{width:32px;margin:0 5px}
  .step{font-size:8px;gap:5px}.step .num{width:22px;height:22px}
  .panel,.summary{padding:17px;border-radius:19px}
  .form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}
  .summary-items{max-height:250px}
  .review-box{padding:18px;border-radius:19px}
  .review-grid{grid-template-columns:1fr}
  .saved-addresses{padding:10px;margin-bottom:15px}
  .saved-address-item{padding:11px;gap:9px}
  .saved-address-item input{width:18px;height:18px;margin-top:1px}
  .saved-address-copy strong{font-size:9.5px}
  .saved-address-copy p{font-size:8.5px}
  .add-address-btn{height:40px}
}
.payment-option.disabled{
  opacity:.55;
  cursor:not-allowed;
  background:#faf7f8;
}

.payment-option.disabled:hover{
  border-color:#ead7df;
  box-shadow:none;
}

.payment-option.disabled input{
  cursor:not-allowed;
}

/* Checkout pricing + savings polish */
.summary-item-prices{display:flex;flex-wrap:wrap;align-items:center;gap:6px 9px;margin-top:5px;font:8px Arial}
.summary-sale-price{color:var(--pink);font-weight:700}
.summary-compare-price{color:#a9939c;text-decoration:line-through}
.order-savings{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:9px;padding:8px 10px;border:1px solid #dcefe4;border-radius:10px;background:linear-gradient(135deg,#f5fcf8,#fff);color:#2f7b57;font:700 9px Arial}
.order-savings-icon{width:17px;height:17px;display:grid;place-items:center;border-radius:50%;background:#e5f6ec;font-size:9px;flex:0 0 auto}
.order-savings strong{font-weight:800}

/* Final visual polish — UI only; no checkout logic changed */
@media (hover:none){
  .summary-qty button:hover,.summary-remove:hover,.apply:hover{background:inherit;color:inherit}
}
.summary-qty button:focus-visible,.summary-remove:focus-visible,.apply:focus-visible,.coupon-applied button:focus-visible,.saved-btn:focus-visible,.primary:focus-visible,.secondary-btn:focus-visible,.address-default-btn:focus-visible,.address-delete-btn:focus-visible,.add-address-btn:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
@media(max-width:600px){
  .checkout-top{gap:10px}
  .back{font-size:10px}
  .secure{font-size:7px}
  .checkout-title{margin-bottom:20px}
  .checkout-title h1{font-size:34px}
  .steps{max-width:100%;padding:0 2px}
  .step{font-size:7.5px}
  .step .num{width:24px;height:24px}
  .step-line{flex:1;width:auto;max-width:42px}
  .summary-item-actions{gap:6px}
  .summary-qty{height:30px}
  .summary-qty button{width:29px;min-width:29px}
  .summary-qty span{min-width:28px}
  .summary-remove{width:30px;height:30px}
  .summary-item-prices{gap:5px;margin-top:4px;font-size:7.5px;line-height:1.3}
  .order-savings{justify-content:center;margin-top:8px;padding:8px 9px;font-size:8px}
  .coupon{margin-top:15px;padding:13px}
  .coupon-row{gap:6px}
  .coupon-row input,.apply{height:39px}
}
@media(max-width:360px){
  .checkout-wrap{width:calc(100% - 18px)}
  .checkout-top{gap:6px}
  .back span{display:none}
  .checkout-brand img{width:70px}
  .secure{font-size:6.5px}
  .step{font-size:7px;gap:4px}
  .step .num{width:22px;height:22px}
  .step-line{max-width:28px;margin:0 3px}
  .coupon-row{grid-template-columns:minmax(0,1fr) auto}
  .apply{padding:0 12px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition-duration:0.01ms!important;animation-duration:0.01ms!important;animation-iteration-count:1!important}
}

/* Premium checkout alerts — matches Parameters page alert language/UI */
.parameter-alert-stack{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;width:min(92vw,430px);display:flex;flex-direction:column;gap:10px;pointer-events:none}
.parameter-alert{pointer-events:auto;background:#fff;border:1px solid #ead5e1;border-radius:16px;padding:13px 14px;box-shadow:0 14px 35px rgba(63,30,48,.18);display:flex;align-items:center;gap:11px;animation:parameterAlertIn .22s ease-out}
.parameter-alert-icon{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#fff0f6;color:#b4235a;font-weight:900;flex:none}
.parameter-alert-content{flex:1;min-width:0}.parameter-alert-title{font-size:12px;font-weight:800;color:#4c3042}.parameter-alert-message{margin-top:2px;font-size:11px;line-height:1.4;color:#816b76}
.parameter-alert-actions{display:flex;gap:7px;flex:none}.parameter-alert-actions button{border:1px solid #ead5e1;border-radius:9px;padding:8px 11px;background:#fff;color:#68485a;font-size:11px;font-weight:800;cursor:pointer}.parameter-alert-actions .danger{border-color:#c83288;background:linear-gradient(90deg,#d63391,#c84c94);color:#fff}
.parameter-alert.success .parameter-alert-icon{background:#eaf8f0;color:#25834a}.parameter-alert.error .parameter-alert-icon{background:#fff0f2;color:#b4234f}.parameter-alert.info .parameter-alert-icon{background:#fff0f6;color:#b4235a}
.parameter-alert-actions button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
@keyframes parameterAlertIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:700px){.parameter-alert-stack{bottom:14px;width:calc(100vw - 24px)}.parameter-alert{padding:12px}}

/* Premium pincode lookup — isolated UI */
.location-field{position:relative}
.location-input-wrap{position:relative;display:flex;align-items:center}
.location-input-wrap input{padding-right:48px!important}
.location-search-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;font-size:13px;line-height:1;box-shadow:0 5px 12px rgba(214,51,108,.18)}
.location-search-btn:disabled{opacity:.55;cursor:not-allowed}
.location-search-btn:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.location-status{display:none;margin-top:6px;padding:7px 9px;border-radius:9px;border:1px solid #ead7df;background:#fffafd;color:var(--muted);font:8px/1.35 Arial}
.location-status.show{display:block}
.location-status.success{color:var(--green);background:#f5fcf8;border-color:#d9eee2}
.location-status.error{color:#b4234f;background:#fff5f7;border-color:#efd6df}
.location-select{width:100%;height:43px;border:1px solid #e5cbd6;border-radius:11px;background:#fff;color:var(--ink);outline:none;padding:0 12px;font:11px Arial;transition:.18s}
.location-select:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(214,51,108,.07)}
.location-select:disabled{background:#faf7f8;color:#aa929d;cursor:not-allowed}
@media(max-width:600px){
  .location-input-wrap input{padding-right:45px!important}
  .location-search-btn{width:29px;height:29px;right:5px;border-radius:8px;font-size:12px}
  .location-select{height:41px;border-radius:10px;font-size:10px;padding:0 10px}
  .location-status{font-size:7.5px;padding:6px 8px}
}

</style>
</head>
<body>
<div class="top-bar">✨ Free Shipping Across India <span>|</span> 💝 Carefully Packed With Love</div>
<header class="main-header">

function esc(v){
  return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function money(v){
  const n=Number(v);
  return Number.isFinite(n)
    ? `₹${n.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}`
    : "₹0.00";
}
function showToast(message,type="info",title=""){
  const stack=document.getElementById("checkoutAlertStack");
  if(!stack)return;
  const inferredType=type||((/^Unable|^Please|^This item is out of stock|^This coupon/i).test(message)?"error":"info");
  const inferredTitle=title||(inferredType==="error"?"Please check":"Done");
  const alertEl=document.createElement("div");
  alertEl.className=`parameter-alert ${inferredType}`;
  const icon=inferredType==="error"?"!":inferredType==="success"?"✓":"i";
  alertEl.innerHTML=`<div class="parameter-alert-icon">${icon}</div><div class="parameter-alert-content"><div class="parameter-alert-title">${esc(inferredTitle)}</div><div class="parameter-alert-message">${esc(message)}</div></div>`;
  stack.appendChild(alertEl);
  setTimeout(()=>{alertEl.style.transition="opacity .18s ease, transform .18s ease";alertEl.style.opacity="0";alertEl.style.transform="translateY(8px)";setTimeout(()=>alertEl.remove(),200)},2800);
}
function showCheckoutConfirm(title,message){
  const stack=document.getElementById("checkoutAlertStack");
  if(!stack)return Promise.resolve(false);
  return new Promise(resolve=>{
    const alertEl=document.createElement("div");
    alertEl.className="parameter-alert";
    alertEl.innerHTML=`<div class="parameter-alert-icon">!</div><div class="parameter-alert-content"><div class="parameter-alert-title">${esc(title)}</div><div class="parameter-alert-message">${esc(message)}</div></div><div class="parameter-alert-actions"><button type="button" data-alert-cancel>Cancel</button><button type="button" class="danger" data-alert-confirm>Delete</button></div>`;
    stack.appendChild(alertEl);
    let settled=false;
    const finish=value=>{if(settled)return;settled=true;alertEl.remove();resolve(value)};
    alertEl.querySelector("[data-alert-cancel]").addEventListener("click",()=>finish(false));
    alertEl.querySelector("[data-alert-confirm]").addEventListener("click",()=>finish(true));
  });
}
function getPrice(item){
  const variant=item.product_variants;
  if(variant && Number(variant.price)>=0) return Number(variant.price);
  return Number(item.products?.price||0);
}
function getComparePrice(item){
  const variant=item.product_variants;
  if(variant && Number(variant.compare_at_price)>0) return Number(variant.compare_at_price);
  return Number(item.products?.compare_at_price||0);
}
function getVariantLabel(item){
  const v=item.product_variants;
  if(!v) return "";
  return [v.size,v.color].filter(Boolean).join(" · ");
}
function getStock(item){
  const variant=item.product_variants;
  if(variant) return Number(variant.stock_quantity||0);
  return Number(item.products?.stock_quantity||0);
}
function subtotal(){
  return items.reduce((sum,item)=>sum+getPrice(item)*Number(item.quantity||0),0);
}
function productSavings(){
  return items.reduce((sum,item)=>{
    const price=getPrice(item);
    const compare=getComparePrice(item);
    const qty=Number(item.quantity||0);
    return sum + (compare>price ? (compare-price)*qty : 0);
  },0);
}
function shipping(sub){
  if(sub<=0) return 0;
  return sub>=shippingMinimumAmount ? 0 : shippingCharge;
}
function couponDiscount(sub){
  if(!coupon) return 0;
  let d=coupon.discount_type==="percentage"
    ? sub*Number(coupon.discount_value)/100
    : Number(coupon.discount_value);
  if(coupon.maximum_discount_amount!=null) d=Math.min(d,Number(coupon.maximum_discount_amount));
  return Math.max(0,Math.min(d,sub));
}
function discountAmount(){
  const value=Number(couponDiscount(subtotal())||0);
  return Number.isFinite(value)?Math.max(0,value):0;
}
function currentTotal(){
  return Math.max(0,subtotal()+shipping(subtotal())+codChargeForPayment()-discountAmount());
}
function codChargeForPayment(){
  return selectedPayment==="cod" ? codCharge : 0;
}

){

function setLocationStatus(message,type=""){
  const el=document.getElementById("locationStatus");
  if(!el)return;
  el.textContent=message||"";
  el.className=`location-status${message?" show":""}${type?` ${type}`:""}`;
}

function normalizeLocation(value){
  return String(value??"").trim().toLowerCase().replace(/[^a-z0-9]+/g," ");
}

function officeName(o){
  return String(o?.Name??o?.name??o?.office_name??o?.officename??o?.OfficeName??"").trim();
}
function officeState(o){
  return String(o?.State??o?.state??"").trim();
}
function officePin(o){
  return String(o?.Pincode??o?.pincode??o?.PINCode??"").trim();
}

function populateLocation(offices,preferredCity=""){
  const city=document.getElementById("city");
  const state=document.getElementById("state");
  if(!city||!state)return false;

  const valid=(offices||[]).filter(o=>/^\d{6}$/.test(officePin(o)));
  if(!valid.length)return false;

  const states=[...new Set(valid.map(officeState).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,"en",{sensitivity:"base"}));
  const cities=[...new Set(valid.map(officeName).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,"en",{sensitivity:"base"}));

  state.innerHTML='<option value="">Select state</option>';
  states.forEach(v=>{
    const o=document.createElement("option");
    o.value=v;o.textContent=v;state.appendChild(o);
  });

  city.innerHTML='<option value="">Select city / area</option>';
  cities.forEach(v=>{
    const o=document.createElement("option");
    o.value=v;o.textContent=v;city.appendChild(o);
  });

  state.disabled=false;
  city.disabled=false;

  if(states.length===1)state.value=states[0];

  if(preferredCity){
    const wanted=normalizeLocation(preferredCity);
    const exact=[...city.options].find(o=>normalizeLocation(o.value)===wanted);
    const match=exact||[...city.options].find(o=>{
      const v=normalizeLocation(o.value);
      return v.includes(wanted)||wanted.includes(v);
    });
    if(match)city.value=match.value;
  }
  return true;
}

async function lookupPincode(pincode,preferredCity=""){
  const input=document.getElementById("pincode");
  const button=document.getElementById("pincodeSearch");
  const pin=String(pincode||"").replace(/\D/g,"").slice(0,6);
  if(input)input.value=pin;

  if(pin.length!==6){
    setLocationStatus("");
    return false;
  }

  const token=++pincodeLookupToken;
  if(button)button.disabled=true;
  setLocationStatus("Finding your city and state…");

  try{
    const response=await fetch(`${PINCODE_API}/pincode/${encodeURIComponent(pin)}`,{
      headers:{"Accept":"application/json"}
    });
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    const data=await response.json();
    if(token!==pincodeLookupToken)return false;

    const offices=Array.isArray(data?.[0]?.PostOffice)?data[0].PostOffice:[];
    pincodeOfficeData=offices.filter(o=>officePin(o)===pin);

    if(!pincodeOfficeData.length){
      pincodeOfficeData=[];
      setLocationStatus("Pincode not found. Please check the 6-digit number.","error");
      const city=document.getElementById("city"),state=document.getElementById("state");
      if(city){city.innerHTML='<option value="">Enter a valid pincode first</option>';city.disabled=true}
      if(state){state.innerHTML='<option value="">Enter a valid pincode first</option>';state.disabled=true}
      return false;
    }

    populateLocation(pincodeOfficeData,preferredCity);
    const state=document.getElementById("state")?.value||"";
    const city=document.getElementById("city")?.value||"";

    setLocationStatus(
      city&&state ? `✓ ${city}, ${state}` : "✓ Pincode found. Select the city / area.",
      "success"
    );
    return true;
  }catch(error){
    console.error("Pincode lookup failed:",error);
    if(token!==pincodeLookupToken)return false;
    pincodeOfficeData=[];
    setLocationStatus("Unable to find this pincode right now. Please try again.","error");
    const city=document.getElementById("city"),state=document.getElementById("state");
    if(city){city.innerHTML='<option value="">Enter pincode first</option>';city.disabled=true}
    if(state){state.innerHTML='<option value="">Enter pincode first</option>';state.disabled=true}
    return false;
  }finally{
    if(token===pincodeLookupToken&&button)button.disabled=false;
  }
}

function bindLocationLookup(){
  const input=document.getElementById("pincode");
  const button=document.getElementById("pincodeSearch");
  if(!input)return;

  input.addEventListener("input",()=>{
    input.value=input.value.replace(/\D/g,"").slice(0,6);
    clearTimeout(locationLookupTimer);

    if(input.value.length<6){
      pincodeOfficeData=[];
      setLocationStatus("");
      const city=document.getElementById("city"),state=document.getElementById("state");
      if(city){city.innerHTML='<option value="">Enter pincode first</option>';city.disabled=true}
      if(state){state.innerHTML='<option value="">Enter pincode first</option>';state.disabled=true}
      return;
    }
    locationLookupTimer=setTimeout(()=>lookupPincode(input.value),180);
  });

  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      e.preventDefault();
      lookupPincode(input.value);
    }
  });

  button?.addEventListener("click",()=>lookupPincode(input.value));

  document.getElementById("city")?.addEventListener("change",()=>{
    const state=document.getElementById("state")?.value||"";
    const city=document.getElementById("city")?.value||"";
    if(state&&city)setLocationStatus(`✓ ${city}, ${state}`,"success");
  });
}

async function setDefaultAddress(id){
  const target=addresses.find(a=>a.id===id);
  if(!target || target.is_default)return;

  const previousDefaults=addresses.filter(a=>a.is_default).map(a=>a.id);
  const buttons=[...document.querySelectorAll('[data-address-action="default"]')];
  buttons.forEach(b=>b.disabled=true);

  try{
    // Clear other defaults first so this also works when the database has a unique
    // constraint allowing only one default address per user.
    const {error:clearError}=await supabase.from("addresses")
      .update({is_default:false,updated_at:new Date().toISOString()})
      .eq("user_id",user.id);
    if(clearError)throw clearError;

    const {error:setError}=await supabase.from("addresses")
      .update({is_default:true,updated_at:new Date().toISOString()})
      .eq("id",id).eq("user_id",user.id);
    if(setError){
      // Best-effort rollback so a failed switch does not leave the user without a default.
      for(const oldId of previousDefaults){
        await supabase.from("addresses").update({is_default:true}).eq("id",oldId).eq("user_id",user.id);
      }
      throw setError;
    }

    addresses.forEach(a=>a.is_default=a.id===id);
    selectedAddressId=id;
    fillAddress(target);
    refreshSavedAddressList();
    showToast("Default address updated","success","Success");
  }catch(error){
    console.error(error);
    showToast("Unable to change default address","error","Something went wrong");
    buttons.forEach(b=>b.disabled=false);
  }
}
async function deleteSavedAddress(id){
  const target=addresses.find(a=>a.id===id);
  if(!target)return;
  if(!(await showCheckoutConfirm("Delete saved address?","This address will be removed from your saved addresses.")))return;

  const wasDefault=!!target.is_default;
  const remaining=addresses.filter(a=>a.id!==id);
  const replacement=wasDefault ? remaining[0] : null;
  const deleteButtons=[...document.querySelectorAll(`[data-address-action="delete"][data-address-id="${CSS.escape(id)}"]`)];
  deleteButtons.forEach(b=>b.disabled=true);

  try{
    if(wasDefault && replacement){
      // Make the replacement default before deleting the old default, with rollback
      // if either database operation fails.
      const {error:clearError}=await supabase.from("addresses")
        .update({is_default:false,updated_at:new Date().toISOString()})
        .eq("user_id",user.id);
      if(clearError)throw clearError;

      const {error:setError}=await supabase.from("addresses")
        .update({is_default:true,updated_at:new Date().toISOString()})
        .eq("id",replacement.id).eq("user_id",user.id);
      if(setError){
        // Restore the previous default if promoting the replacement fails.
        await supabase.from("addresses")
          .update({is_default:true,updated_at:new Date().toISOString()})
          .eq("id",id).eq("user_id",user.id);
        throw setError;
      }
    }

    const {error:deleteError}=await supabase.from("addresses")
      .delete().eq("id",id).eq("user_id",user.id);
    if(deleteError){
      if(wasDefault && replacement){
        await supabase.from("addresses").update({is_default:false}).eq("id",replacement.id).eq("user_id",user.id);
        await supabase.from("addresses").update({is_default:true}).eq("id",id).eq("user_id",user.id);
      }
      throw deleteError;
    }

    addresses=remaining;
    if(selectedAddressId===id){
      const nextDefault=addresses.find(a=>a.is_default)||addresses[0]||null;
      selectedAddressId=nextDefault?.id||null;
      if(nextDefault)fillAddress(nextDefault);
      else clearAddressForm();
    }
    refreshSavedAddressList();
    showToast("Address deleted","success","Success");
  }catch(error){
    console.error(error);
    showToast("Unable to delete address","error","Something went wrong");
    deleteButtons.forEach(b=>b.disabled=false);
  }
}

async function fillAddress(a){
  if(!a)return;
  selectedAddressId=a.id;
  document.getElementById("fullName").value=a.full_name||"";
  document.getElementById("phone").value=a.phone||"";
  document.getElementById("addressLine1").value=a.address_line1||"";
  document.getElementById("addressLine2").value=a.address_line2||"";
  const pin=document.getElementById("pincode");
  if(pin)pin.value=String(a.pincode||"").replace(/\\D/g,"").slice(0,6);

  if(pin?.value.length===6){
    await restoreLocationForAddress(a);
  }else{
    const city=document.getElementById("city"),state=document.getElementById("state");
    if(city){city.innerHTML='<option value="">Enter pincode first</option>';city.disabled=true}
    if(state){state.innerHTML='<option value="">Enter pincode first</option>';state.disabled=true}

function addressPayload(){
  return {
    full_name:document.getElementById("fullName").value.trim(),
    phone:document.getElementById("phone").value.trim(),
    address_line1:document.getElementById("addressLine1").value.trim(),
    address_line2:document.getElementById("addressLine2").value.trim()||null,
    city:document.getElementById("city").value.trim(),
    state:document.getElementById("state").value.trim(),
    pincode:document.getElementById("pincode").value.trim()
  };
}
function validateAddress(a){
  if(!a.full_name||!a.phone||!a.address_line1||!a.city||!a.state||!a.pincode){
    showToast("Please complete the shipping address","error","Please check");
    return false;
  }
  if(!/^[0-9+\-\s()]{8,20}$/.test(a.phone)){
    showToast("Please enter a valid phone number","error","Please check");
    return false;
  }
  if(!/^[0-9]{6}$/.test(a.pincode)){
    showToast("Please enter a valid 6-digit pincode","error","Please check");
    return false;
  }

  if(!pincodeOfficeData.length || !pincodeOfficeData.some(o=>officePin(o)===a.pincode)){
    showToast("Please search the pincode before continuing","error","Please check");
    return false;
  }

  if(!document.getElementById("city")?.value || !document.getElementById("state")?.value){
    showToast("Please select the city / area for this pincode","error","Please check");
    return false;
  }
  return true;
}
async function saveAddressIfNeeded(payload){
  const shouldSave=document.getElementById("saveAddress")?.checked===true;
  // IMPORTANT: unchecked means this address is checkout-only. Never insert or update
  // the saved addresses table in that case. The payload is still passed to review.
  if(!shouldSave)return false;

  if(selectedAddressId){
    const existing=addresses.find(a=>a.id===selectedAddressId);
    if(existing){
      const changed=["full_name","phone","address_line1","address_line2","city","state","pincode"]
        .some(k=>(existing[k]||null)!==(payload[k]||null));
      if(!changed)return true;
      const updatedAt=new Date().toISOString();
      const {error}=await supabase.from("addresses")
        .update({...payload,updated_at:updatedAt})
        .eq("id",selectedAddressId).eq("user_id",user.id);
      if(error)throw error;
      Object.assign(existing,payload,{updated_at:updatedAt});
      refreshSavedAddressList();
      return true;
    }
  }

  const {data,error}=await supabase.from("addresses")
    .insert({...payload,user_id:user.id,is_default:addresses.length===0})
    .select().single();
  if(error)throw error;
  selectedAddressId=data.id;
  addresses.unshift(data);
  refreshSavedAddressList();
  return true;
}

async function changeCheckoutItem(id,qty){
  const item=items.find(x=>x.id===id);
  if(!item)return;
  if(qty<=0){
    const {error}=await supabase.from("cart_items").delete().eq("id",id);
    if(error){showToast("Unable to remove item","error","Something went wrong");return}
    items=items.filter(x=>x.id!==id);
    await updateCartCount(user.id);
    if(!items.length){location.href="cart.html";return}
    refreshSummary();
    showToast("Item removed","success","Success");
    return;
  }
  const max=getStock(item);
  if(max<1){showToast("This item is out of stock","error","Please check");return}
  qty=Math.min(qty,max);
  const {error}=await supabase.from("cart_items").update({quantity:qty,updated_at:new Date().toISOString()}).eq("id",id).eq("cart_id",cart.id);
  if(error){showToast("Unable to update quantity","error","Something went wrong");return}
  item.quantity=qty;
  await updateCartCount(user.id);
  refreshSummary();
}

async function applyCoupon(){
  const input=document.getElementById("couponInput");
  const code=input?.value.trim().toUpperCase();
  if(!code)return setCouponMsg("Enter a coupon code","error");
  const now=new Date().toISOString(),sub=subtotal();
  const {data:c,error}=await supabase.from("coupons")
    .select("id,code,description,discount_type,discount_value,minimum_order_amount,maximum_discount_amount,usage_limit,usage_per_user,start_date,end_date,is_active")
    .eq("code",code).eq("is_active",true).maybeSingle();
  if(error){console.error(error);return setCouponMsg("Unable to validate this coupon","error")}
  if(!c)return setCouponMsg("This coupon is not available","error");
  if(c.start_date&&now<c.start_date)return setCouponMsg("This coupon is not active yet","error");
  if(c.end_date&&now>c.end_date)return setCouponMsg("This coupon has expired","error");
  if(c.minimum_order_amount!=null&&sub<Number(c.minimum_order_amount))return setCouponMsg(`Minimum order value is ${money(c.minimum_order_amount)}`,"error");
  if(c.usage_limit!=null){
    const {count}=await supabase.from("coupon_usage").select("id",{count:"exact",head:true}).eq("coupon_id",c.id);
    if(count>=Number(c.usage_limit))return setCouponMsg("This coupon usage limit has been reached","error");
  }
  const {count:userUses}=await supabase.from("coupon_usage").select("id",{count:"exact",head:true}).eq("coupon_id",c.id).eq("user_id",user.id);
  if(userUses>=Number(c.usage_per_user||1))return setCouponMsg("You have already used this coupon","error");
  coupon=c;
  refreshSummary();
  const applied=document.getElementById("couponApplied");
  if(applied){applied.classList.add("show");applied.querySelector("span").textContent=`${c.code} applied`;}
  setCouponMsg(`${c.code} applied successfully`,"success");
}

function setCouponMsg(t,type){
  const m=document.getElementById("couponMsg");
  if(!m)return;
  m.textContent=t;
  m.className=`coupon-msg show ${type}`;
}

function bind(){
  document.getElementById("savedAddressBtn")?.addEventListener("click",()=>{
    const panel=document.getElementById("savedAddresses");
    if(!panel)return;
    if(panel.classList.contains("show")){
      panel.classList.remove("show");
      return;
    }
    // Opening Saved Addresses always loads the user's default address first.
    const defaultAddress=addresses.find(a=>a.is_default) || addresses[0];
    if(defaultAddress) fillAddress(defaultAddress);
    refreshSavedAddressList();
    panel.classList.add("show");
  });
  bindSavedAddressControls();
  document.querySelectorAll("[data-cart-action]").forEach(button=>{
    button.addEventListener("click",async()=>{
      const row=button.closest("[data-cart-item]");
      const id=row?.dataset.cartItem;
      const action=button.dataset.cartAction;
      const item=items.find(x=>x.id===id);
      if(!item)return;
      if(action==="remove"){await changeCheckoutItem(id,0);return}
      const qty=Number(item.quantity||0);
      if(action==="minus")await changeCheckoutItem(id,qty-1);
      if(action==="plus")await changeCheckoutItem(id,Math.min(qty+1,getStock(item)));
    });
  });

  document.getElementById("applyCoupon")?.addEventListener("click",applyCoupon);
  document.getElementById("couponInput")?.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();applyCoupon();}
  });
  document.getElementById("removeCoupon")?.addEventListener("click",()=>{
    coupon=null;
    refreshSummary();
    const input=document.getElementById("couponInput");
    if(input)input.value="";
    document.getElementById("couponApplied")?.classList.remove("show");
    const msg=document.getElementById("couponMsg");
    if(msg){msg.textContent="";msg.className="coupon-msg";}
    showToast("Coupon removed","success","Success");
  });

  document.getElementById("addressForm")?.addEventListener("submit",async e=>{
    e.preventDefault();

    const payload=addressPayload();
    if(!validateAddress(payload))return;

    const btn=document.getElementById("continuePayment");
    if(btn)btn.disabled=true;

    try{
      const savedToAddressBook=await saveAddressIfNeeded(payload);

      // Always carry the actual checkout address forward. If the user did not
      // choose "Save this address", addressId stays null and nothing is persisted.
      const checkoutState={
        addressId:savedToAddressBook ? selectedAddressId : null,
        address:payload,
        paymentMethod:selectedPayment,
        couponCode:coupon?.code||null
      };

      // Ask PostgreSQL to re-check the cart, stock, coupon and payment method
      // before leaving checkout. The browser-calculated amount is never sent.
      const {data:quote,error:quoteError}=await supabase.rpc("get_checkout_quote",{
        p_payment_method:selectedPayment,
        p_coupon_code:coupon?.code||null,
        p_address_id:savedToAddressBook ? selectedAddressId : null
      });
      if(quoteError) throw quoteError;
      if(!quote?.valid) throw new Error(quote?.message||"Checkout details are no longer valid. Please review your order.");

      // Only non-authoritative selections are carried to review. Review/order
      // creation must obtain the authoritative amount again from PostgreSQL.
      sessionStorage.setItem("ssSparkCheckout",JSON.stringify(checkoutState));
      window.location.href="review.html";
    }catch(error){
      console.error(error);
      showToast("Unable to continue checkout","error","Something went wrong");
    }finally{
      if(btn)btn.disabled=false;
    }
  });
  document.querySelectorAll(".payment-option").forEach(option=>{
    option.addEventListener("click",()=>{
      selectedPayment=option.dataset.payment;
      const radio=option.querySelector("input");
      if(radio)radio.checked=true;
      updatePaymentUI();
    });
  });

  document.getElementById("placeOrder")?.addEventListener("click",async()=>{
    showToast("Order placement will be connected to payment processing next","info","Coming next");
  });
  bindLocationLookup();
}
document.getElementById("headerSearchBtn")?.addEventListener("click",()=>location.href="search.html");

async function clearPendingCheckoutQuotes(){
  // Returning to Checkout means the previous review quote is no longer the active
  // checkout attempt. Expire it server-side; do not delete it so the audit trail remains.
  try{
    const {error}=await supabase.rpc("clear_pending_checkout_quotes");
    if(error) throw error;
  }catch(error){
    // Keep checkout usable if the cleanup RPC has not been deployed yet.
    // Final order creation still hard-validates the quote server-side.
    console.warn("Pending checkout quote cleanup unavailable:",error);
  }
}

async function restoreCheckoutState(){
  let saved=null;
  try{
    const raw=sessionStorage.getItem("ssSparkCheckout");
    saved=raw?JSON.parse(raw):null;
  }catch{}
  if(!saved)return;

  if(["upi","cod"].includes(saved.paymentMethod)) selectedPayment=saved.paymentMethod;
  if(saved.addressId) selectedAddressId=saved.addressId;
}

async function restoreCheckoutCoupon(){
  let saved=null;
  try{
    const raw=sessionStorage.getItem("ssSparkCheckout");
    saved=raw?JSON.parse(raw):null;
  }catch{}
  const code=String(saved?.couponCode||"").trim().toUpperCase();
  if(!code)return;
  const input=document.getElementById("couponInput");
  if(input)input.value=code;
  await applyCoupon();
}

async function init(){
  try{
    const ok=await authUI();
    if(!ok){location.href="login.html";return}
    await restoreCheckoutState();
    await clearPendingCheckoutQuotes();
    await loadParameters();
    await loadCart();
    await loadAddresses();
    render();

    // Restore the exact address the customer had selected before Review.
    const savedRaw=sessionStorage.getItem("ssSparkCheckout");
    let saved=null;
    try{saved=savedRaw?JSON.parse(savedRaw):null}catch{}
    if(saved?.addressId){
      const savedAddress=addresses.find(a=>a.id===saved.addressId);
      if(savedAddress) await fillAddress(savedAddress);
    }else if(saved?.address){
      fillAddress(saved.address);
      selectedAddressId=null;
    }

    // Restore the coupon after the checkout DOM has been rendered and revalidate it
    // against the current cart. If it is no longer valid, it is intentionally not restored.
    await restoreCheckoutCoupon();
  }catch(error){
    console.error(error);
    root.className="card empty";
    root.innerHTML='<h2>We could not load checkout</h2><p>Please refresh and try again.</p>';
  }
}
init();
