<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Details | SS Spark Collections</title>
<link rel="stylesheet" href="style.css">
<style>
:root{
  --ov-pink:#d6336c;
  --ov-pink2:#c52d61;
  --ov-rose:#8f294f;
  --ov-ink:#542238;
  --ov-muted:#987080;
  --ov-border:#edd9e2;
  --ov-soft:#fff7fa;
  --ov-green:#218a57;
  --ov-shadow:0 18px 50px rgba(83,35,52,.08);
}
*{box-sizing:border-box}
body{margin:0;color:var(--ov-ink);font-family:Arial,sans-serif}
button,input{font:inherit}
a{text-decoration:none}

/* Keep this page's header interactions polished and stable. */
.profile-menu-item:hover{transform:none}

.order-view-page{
  min-height:100vh;
  background:
    radial-gradient(circle at 7% 6%,rgba(214,51,108,.055),transparent 25%),
    radial-gradient(circle at 94% 8%,rgba(231,84,128,.05),transparent 24%),
    linear-gradient(180deg,#fff9fb 0%,#fff 35%,#fff 100%);
}

.order-view-wrap{
  width:min(1120px,92%);
  margin:0 auto;
  padding:28px 0 80px;
}

.order-view-back{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--ov-rose);
  font:700 10px/1 Arial,sans-serif;
  margin-bottom:25px;
}
.order-view-back:hover{color:var(--ov-pink);transform:none}

.order-view-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:25px;
  margin-bottom:25px;
}
.order-view-eyebrow{
  margin:0 0 8px;
  color:var(--ov-pink);
  font:700 8px/1 Arial,sans-serif;
  letter-spacing:2.5px;
}
.order-view-head h1{
  margin:0;
  color:var(--ov-ink);
  font:500 clamp(30px,4vw,43px)/1.1 Georgia,"Times New Roman",serif;
}
.order-view-date{
  margin-top:8px;
  color:var(--ov-muted);
  font:10px/1.4 Arial,sans-serif;
}
.order-view-actions{display:flex;align-items:center;gap:9px}
.order-action{
  height:40px;
  padding:0 15px;
  border-radius:999px;
  border:1px solid #e5c4d2;
  background:#fff;
  color:var(--ov-rose);
  font:700 9px/1 Arial,sans-serif;
  cursor:pointer;
  transition:background .18s ease,border-color .18s ease,color .18s ease;
}
.order-action:hover{
  background:#fff4f8;
  border-color:#d98aa5;
  color:var(--ov-pink);
}
.order-action.primary{
  border-color:var(--ov-pink);
  background:linear-gradient(135deg,var(--ov-pink),#e75480);
  color:#fff;
  box-shadow:0 8px 20px rgba(214,51,108,.15);
}
.order-action.primary:hover{
  background:linear-gradient(135deg,var(--ov-pink2),#df4776);
  color:#fff;
}

.order-status-hero{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:19px 22px;
  margin-bottom:20px;
  border:1px solid var(--ov-border);
  border-radius:20px;
  background:linear-gradient(135deg,#fff,#fff8fb);
  box-shadow:0 10px 30px rgba(83,35,52,.055);
}
.status-hero-copy{display:flex;align-items:center;gap:13px;min-width:0}
.status-hero-icon{
  width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;
  background:#fff0f5;border:1px solid #f0d5e0;
  color:var(--ov-pink);font-size:17px;flex-shrink:0;
}
.status-hero-copy strong{display:block;font:600 14px/1.2 Georgia,serif}
.status-hero-copy span{display:block;margin-top:4px;color:var(--ov-muted);font:9px/1.4 Arial,sans-serif}
.status-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 12px;border-radius:999px;
  font:700 9px/1 Arial,sans-serif;white-space:nowrap;
}
.status-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.status-pending{background:#fff6dc;color:#9a7100}
.status-processing{background:#eee9ff;color:#6b4fc4}
.status-shipped{background:#e6f5ff;color:#1973a5}
.status-completed{background:#eaf8ef;color:#2c8a4b}
.status-canceled{background:#ffecec;color:#c14b4b}

.order-view-grid{
  display:grid;
  grid-template-columns:minmax(0,1.45fr) minmax(320px,.72fr);
  gap:20px;
  align-items:start;
}
.order-view-left,.order-view-right{display:flex;flex-direction:column;gap:20px}

.ov-card{
  background:#fff;
  border:1px solid var(--ov-border);
  border-radius:20px;
  box-shadow:0 10px 30px rgba(83,35,52,.055);
  overflow:hidden;
}
.ov-card-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:18px 20px;
  border-bottom:1px solid #e9a7bc;
  background:linear-gradient(135deg,#f33f93,#e75480);
}
.ov-card-head h2{margin:0;color:#fff;font:500 20px/1.2 Georgia,"Times New Roman",serif}
.ov-card-head span{color:rgba(235, 231, 233, 0.92);font:12px/1 Arial,sans-serif}
.ov-card-body{padding:20px}

.order-items{display:grid;gap:0}
.order-item{
  display:grid;
  grid-template-columns:68px minmax(0,1fr) auto;
  gap:13px;
  align-items:center;
  padding:15px 0;
  border-bottom:1px solid #f2e7eb;
}
.order-item:first-child{padding-top:0}
.order-item:last-child{border-bottom:0;padding-bottom:0}
.order-item-image{
  width:68px;height:72px;border-radius:12px;overflow:hidden;
  border:1px solid #f0dfe5;background:#fff4f7;
  display:grid;place-items:center;color:var(--ov-pink);font:500 16px Georgia,serif;
}
.order-item-image img{width:100%;height:100%;object-fit:cover}
.order-item-name{font:600 12px/1.35 Georgia,"Times New Roman",serif;color:var(--ov-ink)}
.order-item-detail{margin-top:5px;color:var(--ov-muted);font:9px/1.4 Arial,sans-serif}
.order-item-price{text-align:right;white-space:nowrap}
.order-item-price strong{display:block;color:var(--ov-pink);font:700 11px/1 Arial,sans-serif}
.order-item-price span{display:block;margin-top:5px;color:var(--ov-muted);font:8px/1 Arial,sans-serif}

.ov-totals{margin-top:19px;padding-top:17px;border-top:1px solid #f0e1e7}
.ov-total-row{display:flex;justify-content:space-between;gap:20px;padding:6px 0;color:var(--ov-muted);font:10px/1.4 Arial,sans-serif}
.ov-total-row strong{color:var(--ov-ink)}
.ov-total-row.discount,.ov-total-row.discount strong{color:#218a57}
.ov-grand-total{
  margin-top:8px;padding:13px 14px;border-radius:12px;
  background:#fff0f5;color:var(--ov-pink);
  display:flex;justify-content:space-between;align-items:center;
  font:700 16px/1.2 Arial,sans-serif;
}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.info-box{
  padding:14px;border:1px solid #efdee5;border-radius:14px;background:#fffafd;
}
.info-label{display:block;margin-bottom:7px;color:var(--ov-muted);font:700 7px/1 Arial,sans-serif;letter-spacing:1px;text-transform:uppercase}
.info-value{color:var(--ov-ink);font:600 10px/1.5 Arial,sans-serif;word-break:break-word}
.info-value.subtle{color:#6e5361;font-weight:500}

.address-box{
  padding:16px;border:1px solid #efdee5;border-radius:14px;
  background:linear-gradient(145deg,#fff,#fff9fb);
}
.address-name{font:700 11px/1.3 Arial,sans-serif;color:var(--ov-ink);margin-bottom:6px}
.address-line{color:#6e5361;font:10px/1.65 Arial,sans-serif}

.payment-box{display:flex;align-items:center;gap:12px}
.payment-icon{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:#fff0f5;border:1px solid #f0d5e0;color:var(--ov-pink);font-size:17px;
}
.payment-copy strong{display:block;font:700 11px/1.2 Arial,sans-serif}
.payment-copy span{display:block;margin-top:4px;color:var(--ov-muted);font:9px/1.4 Arial,sans-serif}

.shipment-card .ov-card-body{padding:20px}
.shipment-summary{
  display:flex;align-items:center;justify-content:space-between;gap:15px;
  padding:13px;border:1px solid #efdee5;border-radius:14px;background:#fffafd;
}
.shipment-summary-main{display:flex;align-items:center;gap:10px;min-width:0}
.shipment-icon{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:#fff0f5;color:var(--ov-pink);font-size:16px;flex-shrink:0;
}
.shipment-summary-label{color:var(--ov-muted);font:700 7px/1 Arial,sans-serif;letter-spacing:1px}
.shipment-summary-name{margin-top:5px;color:var(--ov-ink);font:700 10px/1.2 Arial,sans-serif}
.shipment-summary-method{margin-top:3px;color:var(--ov-muted);font:8px/1.3 Arial,sans-serif}
.package{text-align:right}
.package-label{display:block;color:var(--ov-muted);font:700 7px/1 Arial,sans-serif;letter-spacing:1px}
.package strong{display:block;margin-top:5px;color:var(--ov-ink);font:700 13px/1 Arial,sans-serif}

 .status-detail-card{
  margin-top:14px;padding:14px;border:1px solid #efdee5;border-radius:14px;
  background:linear-gradient(145deg,#fff9fb,#fff);box-shadow:0 7px 20px rgba(83,35,52,.035);
}
.status-detail-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.status-detail-label{color:var(--ov-pink);font:700 7px/1 Arial,sans-serif;letter-spacing:1.1px;text-transform:uppercase}
.status-detail-title{margin-top:6px;color:var(--ov-ink);font:700 12px/1.3 Arial,sans-serif}
.status-detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:11px}
.status-detail-item{padding:10px;border:1px solid #f0e2e7;border-radius:11px;background:#fff}
.status-detail-item span{display:block;color:var(--ov-muted);font:700 7px/1 Arial,sans-serif;letter-spacing:.7px;text-transform:uppercase}
.status-detail-item strong{display:block;margin-top:5px;color:var(--ov-ink);font:600 9px/1.45 Arial,sans-serif;word-break:break-word}
.status-detail-note{margin-top:10px;padding:10px 11px;border-radius:10px;background:#faf5f7;color:#6e5361;font:9px/1.5 Arial,sans-serif}
.timeline{position:relative;margin-top:22px;padding-left:7px}
.timeline::before{
  content:"";position:absolute;left:14px;top:13px;bottom:13px;width:1px;background:#eadce2;
}
.timeline-step{
  position:relative;display:grid;grid-template-columns:29px minmax(0,1fr);
  gap:12px;min-height:58px;
}
.timeline-marker{
  position:relative;z-index:1;width:29px;height:29px;border-radius:50%;
  display:grid;place-items:center;border:1px solid #dfd2d8;background:#f8f5f6;
  color:#8e7a84;font:700 9px/1 Arial,sans-serif;
}
.timeline-step.done .timeline-marker{
  background:var(--ov-pink);border-color:var(--ov-pink);color:#fff;
}
.timeline-step.current .timeline-marker{
  background:#fff0f5;border-color:#e5a8bd;color:var(--ov-pink);
}
.timeline-content{padding-top:2px}
.timeline-title{color:var(--ov-ink);font:600 11px/1.3 Arial,sans-serif}
.timeline-date{margin-top:4px;color:var(--ov-muted);font:8px/1.4 Arial,sans-serif}
.timeline-note{margin-top:3px;color:#a78e99;font:8px/1.4 Arial,sans-serif}

.tracking-box{
  margin-top:8px;padding:14px;border:1px dashed #e3c5d2;border-radius:14px;
  background:#fff9fb;
}
.tracking-label{color:var(--ov-muted);font:700 7px/1 Arial,sans-serif;letter-spacing:1px;text-transform:uppercase}
.tracking-number{margin-top:7px;color:var(--ov-ink);font:700 10px/1.3 Arial,sans-serif;word-break:break-all}
.tracking-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.track-btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:34px;padding:0 12px;border-radius:999px;
  background:linear-gradient(135deg,var(--ov-pink),#e75480);color:#fff;
  font:700 8px/1 Arial,sans-serif;box-shadow:0 7px 17px rgba(214,51,108,.14);
}
.copy-track{
  min-height:34px;padding:0 12px;border-radius:999px;
  border:1px solid #e4c5d2;background:#fff;color:var(--ov-rose);
  font:700 8px/1 Arial,sans-serif;cursor:pointer;
}

.notes-box{margin-top:10px;padding:13px;border-radius:13px;background:#faf6f8;color:#6e5361;font:9px/1.55 Arial,sans-serif}

.help-box{
  padding:20px;text-align:center;
  background:linear-gradient(145deg,#fff8fb,#fff);
}
.help-icon{
  width:42px;height:42px;margin:0 auto 10px;border-radius:50%;
  display:grid;place-items:center;background:#fff0f5;color:var(--ov-pink);
  border:1px solid #f0d5e0;font-size:16px;
}
.help-box strong{display:block;font:500 17px/1.2 Georgia,serif}
.help-box p{margin:6px auto 0;color:var(--ov-muted);font:9px/1.5 Arial,sans-serif;max-width:280px}

.loading-card,.error-card{
  padding:70px 20px;text-align:center;border:1px solid var(--ov-border);
  border-radius:22px;background:#fff;box-shadow:var(--ov-shadow);
}
.loading-icon,.error-icon{
  width:54px;height:54px;margin:0 auto 14px;border-radius:50%;
  display:grid;place-items:center;background:#fff7fa;border:1px solid #efd7e1;
  color:var(--ov-pink);font:500 20px Georgia,serif;
}
.loading-card strong,.error-card strong{display:block;font:500 22px Georgia,serif}
.loading-card p,.error-card p{margin:7px auto 0;color:var(--ov-muted);font:10px/1.6 Arial,sans-serif;max-width:430px}

@media(max-width:900px){
  .order-view-grid{grid-template-columns:1fr}
}
@media(max-width:700px){
  .order-view-wrap{width:calc(100% - 24px);padding:20px 0 60px}
  .order-view-head{align-items:flex-start;flex-direction:column;gap:15px}
  .order-view-actions{width:100%}
  .order-action{flex:1}
  .order-status-hero{align-items:flex-start;flex-direction:column}
  .order-status-hero .status-pill{align-self:flex-start}
  .info-grid{grid-template-columns:1fr}
  .shipment-summary{align-items:flex-start}
  .order-item{grid-template-columns:58px minmax(0,1fr);gap:11px}
  .order-item-image{width:58px;height:62px}
  .order-item-price{grid-column:2;text-align:left;margin-top:-3px}
  .order-item-price strong{font-size:10px}
  .status-detail-grid{grid-template-columns:1fr}
  .status-detail-card{padding:12px}
}

@media print{
  .top-bar,.main-header,.order-view-back,.order-view-actions,.help-box,.track-btn,.copy-track{display:none!important}
  body{background:#fff!important}
  .order-view-page{background:#fff!important}
  .order-view-wrap{width:100%;padding:0}
  .ov-card,.order-status-hero{box-shadow:none}
  .order-view-grid{grid-template-columns:1fr 1fr}
  .shipment-card{break-inside:avoid}
}
</style>
</head>
<body>
<div class="top-bar">✨ Free Shipping Across India <span>|</span> 💝 Carefully Packed With Love</div>
<header class="main-header">
  <a href="index.html" class="brand-logo"><img src="assets/logo.png" alt="SS Spark Collections"></a>
  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="shop.html" class="active">Shop</a>
    <a href="product-list.html">Products</a>
    <a href="new-arrivals.html">New Arrivals</a>
    <a href="contact.html">Contact</a>
  </nav>
  <div class="header-actions">
    <button class="icon-btn" id="headerSearchBtn" type="button" title="Search" aria-label="Search">🔍</button>
    <a href="cart.html" class="cart-btn" title="Shopping Cart" aria-label="Shopping Cart">🛒<span id="cartCount">0</span></a>
    <div id="authArea" class="auth-area">
      <a href="login.html" class="login-btn">Login</a>
      <a href="create-account.html" class="signup-btn">Create Account</a>
    </div>
  </div>
</header>

<main class="order-view-page">
  <div class="order-view-wrap">
    <a href="order-view.html" class="order-view-back" id="orderBack">← My Orders</a>

    <div id="pageRoot">
      <div class="loading-card">
        <div class="loading-icon">✦</div>
        <strong>Loading your order</strong>
        <p>We are preparing your order details.</p>
      </div>
    </div>
  </div>
</main>

<script type="module" src="order-view.js"></script>

</body>
</html>
