<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Categories | SS Spark Collections</title>

    <link rel="stylesheet" href="admin.css">

    <style>
        .categories-page {
            margin-top: 10px;
        }

        .categories-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .category-search {
            flex: 1;
            max-width: 420px;
            padding: 13px 16px;
            border: 1px solid #ead5e1;
            border-radius: 12px;
            background: white;
            outline: none;
            font-family: inherit;
        }

        .category-search:focus {
            border-color: #c83288;
        }

        .primary-btn {
            border: none;
            border-radius: 12px;
            padding: 13px 20px;
            background: linear-gradient(90deg, #d63391, #c84c94);
            color: white;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .primary-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 7px 18px rgba(196, 67, 139, 0.22);
        }

        .categories-card {
            background: white;
            border: 1px solid #ecdbe4;
            border-radius: 17px;
            overflow: hidden;
        }

        .categories-table {
            width: 100%;
            border-collapse: collapse;
        }

        .categories-table th {
            text-align: left;
            padding: 15px 18px;
            background: #fff5fa;
            color: #936379;
            font-size: 10px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .categories-table td {
            padding: 15px 18px;
            border-top: 1px solid #f1e6ec;
            font-size: 12px;
        }

        .category-thumb {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid #f0dce7;
            background: #fff7fb;
        }

        .category-name {
            font-weight: 600;
            color: #4c3042;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
        }

        .status-active {
            background: #e7f7ed;
            color: #25834a;
        }

        .status-inactive {
            background: #f8e7ec;
            color: #a14b68;
        }

        .empty-categories {
            text-align: center;
            padding: 50px 20px;
            color: #aa8b9c;
        }

        .empty-categories-icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .action-btn {
            border: 1px solid #ead5e1;
            background: white;
            color: #9b3d74;
            padding: 7px 11px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
        }

        .action-btn:hover {
            background: #fff1f7;
        }

        /* =========================
           ADD CATEGORY FORM
        ========================= */

        .category-form-card {
            background: white;
            border: 1px solid #ecdbe4;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(120, 70, 100, 0.06);
        }

        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 25px;
        }

        .form-header span {
            color: #c83288;
            font-size: 10px;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .form-header h2 {
            margin: 6px 0;
            color: #4c3042;
        }

        .form-header p {
            margin: 0;
            color: #9b8490;
            font-size: 12px;
        }

        .close-form-btn {
            border: none;
            background: #fff1f7;
            color: #b72c78;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-bottom: 18px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 600;
            color: #68485a;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #ead5e1;
            border-radius: 11px;
            outline: none;
            font-family: inherit;
            color: #4c3042;
            background: white;
        }

        .form-group textarea {
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #c83288;
        }

        .category-options {
            margin: 5px 0 5px;
        }

        .category-options label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 13px;
            border: 1px solid #ecdbe4;
            border-radius: 10px;
            background: #fff8fb;
            font-size: 11px;
            color: #68485a;
        }

        .category-options input {
            accent-color: #c83288;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .secondary-btn {
            border: 1px solid #e3cbd8;
            background: white;
            color: #68485a;
            padding: 12px 20px;
            border-radius: 11px;
            cursor: pointer;
            font-family: inherit;
        }

        .secondary-btn:hover {
            background: #fff5fa;
        }

        .form-message {
            margin-top: 12px;
            font-size: 12px;
            min-height: 18px;
        }

        .mobile-category-list {
    display: block;
}

.mobile-category-card {
    display: grid;
    grid-template-columns: 72px 1fr;
    gap: 14px;
    padding: 14px;
    margin-bottom: 12px;
    background: #fff;
    border: 1px solid #f0dce5;
    border-radius: 16px;
    box-shadow: 0 8px 22px rgba(83, 35, 52, 0.07);
}

.mobile-category-image {
    width: 72px;
    height: 72px;
    border-radius: 13px;
    object-fit: cover;
    background: #fff4f8;
}

.mobile-category-content {
    min-width: 0;
}

.mobile-category-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
}

.mobile-category-name {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    color: #542238;
}

.mobile-category-slug {
    margin: 4px 0 0;
    font-size: 10px;
    color: #9b7585;
    word-break: break-word;
}

.mobile-category-description {
    margin: 7px 0 0;
    font-size: 11px;
    line-height: 1.45;
    color: #765665;
}

.mobile-category-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 9px;
}

.mobile-category-meta span {
    padding: 4px 8px;
    border-radius: 999px;
    background: #fff4f8;
    color: #8b4c68;
    font-size: 10px;
    font-weight: 600;
}

.mobile-category-actions {
    display: flex;
    gap: 7px;
    margin-top: 11px;
}

.mobile-category-actions button {
    flex: 1;
    min-height: 34px;
    border: 1px solid #ead5df;
    border-radius: 9px;
    background: #fff;
    color: #a52d5e;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
}

.mobile-category-actions button.delete {
    color: #b42335;
}

.mobile-category-actions button:hover {
    transform: none;
}

        @media (max-width: 700px) {

            .categories-toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .category-search {
                max-width: none;
            }

            .primary-btn {
                width: 100%;
            }



            .categories-card {
    overflow: hidden;
}

.categories-table {
    display: none;
}

            .mobile-category-list {
                display: block;
            }
            .category-form-card {
                padding: 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            .form-actions {
                flex-direction: column;
            }

            .form-actions button {
                width: 100%;
            }
        }
        .upload-hint {
    margin-top: 4px;
    font-size: 10px;
    color: #a58d99;
}

.category-image-preview {
    margin-top: 12px;
}

.category-image-preview img {
    width: 110px;
    height: 110px;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid #ead5e1;
    display: block;
}
        /* =========================
           PREMIUM CATEGORY FORM
        ========================= */

        .category-form-card {
            position: relative;
            overflow: hidden;
            border-color: #edd5e2;
            box-shadow: 0 14px 35px rgba(83, 35, 52, 0.08);
        }

        .category-form-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #d63391, #e66a9f, #c83288);
        }

        .category-form-card .form-header {
            padding-bottom: 18px;
            border-bottom: 1px solid #f3e5eb;
        }

        .category-form-card .form-header span {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 0 9px;
            border-radius: 999px;
            background: #fff0f7;
            color: #b52b70;
        }

        .category-form-card .form-header h2 {
            font-size: 20px;
            letter-spacing: -0.2px;
        }

        .category-form-card .form-group input,
        .category-form-card .form-group textarea {
            transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
        }

        .category-form-card .form-group input:hover,
        .category-form-card .form-group textarea:hover {
            border-color: #dfbfd0;
        }

        .category-form-card .form-group input:focus,
        .category-form-card .form-group textarea:focus {
            border-color: #c83288;
            box-shadow: 0 0 0 3px rgba(200, 50, 136, 0.08);
        }

        .category-form-card .close-form-btn {
            border: 1px solid #efd7e3;
            box-shadow: 0 5px 14px rgba(83, 35, 52, 0.06);
        }

        .category-form-card .close-form-btn:hover {
            background: #ffe8f2;
            transform: none;
        }

        .category-form-card #categoryImage {
            padding: 14px;
            border: 1px dashed #dfb8cc;
            background: #fff9fc;
            cursor: pointer;
        }

        .category-form-card #categoryImage:hover {
            border-color: #c83288;
            background: #fff5fa;
        }

        .category-form-card .category-image-preview {
            padding: 10px;
            min-height: 10px;
            border-radius: 13px;
            background: #fff8fb;
        }

        .category-form-card .category-image-preview:has(img) {
            border: 1px solid #f0dce7;
        }

        .category-form-card .category-image-preview img {
            width: 120px;
            height: 120px;
            border-radius: 14px;
            box-shadow: 0 7px 18px rgba(83, 35, 52, 0.08);
        }

        .category-form-card .category-options {
            margin-top: 8px;
        }

        .category-form-card .category-options label {
            position: relative;
            min-width: 92px;
            justify-content: space-between;
            padding: 9px 11px;
            padding-right: 48px;
            border-radius: 999px;
            background: #fff8fb;
            border-color: #ead5e1;
            cursor: pointer;
            user-select: none;
        }

        .category-form-card .category-options input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .category-form-card .category-options label::after {
            content: "";
            position: absolute;
            right: 10px;
            top: 50%;
            width: 30px;
            height: 18px;
            margin-top: -9px;
            border-radius: 999px;
            background: #e4d5dc;
            transition: background .18s ease;
        }

        .category-form-card .category-options label::before {
            content: "";
            position: absolute;
            z-index: 1;
            right: 22px;
            top: 50%;
            width: 14px;
            height: 14px;
            margin-top: -7px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 2px 5px rgba(83, 35, 52, 0.18);
            transition: transform .18s ease;
        }

        .category-form-card .category-options label:has(input:checked) {
            border-color: #e5bdd1;
            background: #fff3f8;
            color: #a92868;
        }

        .category-form-card .category-options label:has(input:checked)::after {
            background: linear-gradient(90deg, #d63391, #c83288);
        }

        .category-form-card .category-options label:has(input:checked)::before {
            transform: translateX(14px);
        }

        .category-form-card .primary-btn,
        .category-form-card .secondary-btn {
            box-shadow: 0 6px 16px rgba(83, 35, 52, 0.06);
        }

        .category-form-card button:hover {
            transform: none;
        }

        .loading-categories {
            color: #9a7b8a;
        }

        .loading-categories .empty-categories-icon {
            opacity: .7;
        }

        .mobile-empty-categories {
            padding: 38px 15px;
            margin: 0;
            background: #fff;
            border: 1px solid #f0dce5;
            border-radius: 15px;
        }

        .mobile-category-list {
            padding: 14px;
        }

        @media (min-width: 701px) {
            .mobile-category-list {
                display: none;
            }
        }

        @media (max-width: 700px) {
            .mobile-category-list {
                display: block !important;
            }

            .category-form-card {
                border-radius: 15px;
            }

            .category-form-card .form-header {
                margin-bottom: 20px;
            }

            .category-form-card .form-header h2 {
                font-size: 18px;
            }

            .mobile-category-list {
                display: block !important;
                padding: 12px;
                min-height: 80px;
            }
        }

    
        /* =========================
           PREMIUM BOTTOM ALERT
        ========================= */
        .category-alert-stack{
            position:fixed;
            left:50%;
            bottom:24px;
            transform:translateX(-50%);
            z-index:9999;
            width:min(92vw,430px);
            display:flex;
            flex-direction:column;
            gap:10px;
            pointer-events:none;
        }
        .category-alert{
            pointer-events:auto;
            background:#fff;
            border:1px solid #ead5e1;
            border-radius:16px;
            padding:13px 14px;
            box-shadow:0 14px 35px rgba(63,30,48,.18);
            display:flex;
            align-items:center;
            gap:11px;
            animation:categoryAlertIn .22s ease-out;
        }
        .category-alert-icon{
            width:32px;height:32px;border-radius:50%;
            display:grid;place-items:center;
            background:#fff0f6;color:#b4235a;font-weight:900;flex:none;
        }
        .category-alert-content{flex:1;min-width:0}
        .category-alert-title{font-size:12px;font-weight:800;color:#4c3042}
        .category-alert-message{margin-top:2px;font-size:11px;line-height:1.4;color:#816b76}
        .category-alert-actions{display:flex;gap:7px;flex:none}
        .category-alert-actions button{
            border:1px solid #ead5e1;border-radius:9px;padding:8px 11px;
            background:#fff;color:#68485a;font-size:11px;font-weight:800;cursor:pointer;
        }
        .category-alert-actions .danger{
            border-color:#c83288;background:linear-gradient(90deg,#d63391,#c84c94);
            color:#fff;
        }
        .category-alert.success .category-alert-icon{background:#eaf8f0;color:#25834a}
        .category-alert.error .category-alert-icon{background:#fff0f2;color:#b4234f}
        @keyframes categoryAlertIn{
            from{opacity:0;transform:translateY(16px) scale(.98)}
            to{opacity:1;transform:translateY(0) scale(1)}
        }
        @media(max-width:700px){
            .category-alert-stack{bottom:14px;width:calc(100vw - 24px)}
            .category-alert{padding:12px}
        }

    </style>
</head>


<body data-admin-page="categories">

<div id="categoryAlertStack" class="category-alert-stack" aria-live="polite"></div>

<div class="admin-layout">

    <!-- SIDEBAR -->

   <div id="admin-navigation"></div>


    <!-- MAIN CONTENT -->

        <button

</div>

        </section>

    </main>

</div>

<script type="module">

import { supabase } from "./supabase-client.js";


document.addEventListener("DOMContentLoaded", () => {


    function showCategoryAlert(message, type = "success", title = "") {
        const stack = document.getElementById("categoryAlertStack");
        if (!stack) return;

        const alert = document.createElement("div");
        alert.className = `category-alert ${type}`;
        alert.innerHTML = `
            <div class="category-alert-icon">${type === "error" ? "!" : "✓"}</div>
            <div class="category-alert-content">
                <div class="category-alert-title">${escapeHtml(title || (type === "error" ? "Something went wrong" : "Success"))}</div>
                <div class="category-alert-message">${escapeHtml(message)}</div>
            </div>
        `;

        stack.appendChild(alert);

        setTimeout(() => {
            alert.style.opacity = "0";
            alert.style.transform = "translateY(10px) scale(.98)";
            alert.style.transition = "opacity .18s ease, transform .18s ease";
            setTimeout(() => alert.remove(), 180);
        }, 2800);
    }

    /* =========================
       ELEMENTS
    ========================= */

    const addCategoryBtn =
        document.getElementById("addCategoryBtn");

    const addCategoryForm =
        document.getElementById("addCategoryForm");

    const closeCategoryForm =
        document.getElementById("closeCategoryForm");

    const cancelCategoryForm =
        document.getElementById("cancelCategoryForm");

    const categoryForm =
        document.getElementById("categoryForm");

    const categoryImage =
        document.getElementById("categoryImage");

    const categoryImagePreview =
        document.getElementById("categoryImagePreview");

    const categoryFormMessage =
        document.getElementById("categoryFormMessage");

    const categoryFormTitle =
        document.getElementById("categoryFormTitle");

    const categorySubmitBtn =
        document.getElementById("categorySubmitBtn");

    const categoriesTableBody =
        document.getElementById("categoriesTableBody");
    
    const mobileCategoryList =
    document.getElementById("mobileCategoryList");
    
    const categorySearch =
    document.getElementById("categorySearch");


let allCategories = [];

    /* =========================
       EDIT STATE
    ========================= */

    let editingCategoryId = null;

    let editingCategoryImageUrl = null;


    /* =========================
       OPEN ADD FORM
    ========================= */

    addCategoryBtn.addEventListener("click", () => {

        addCategoryForm.style.display = "block";

        addCategoryForm.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    });


    /* =========================
       RESET / CLOSE FORM
    ========================= */

    function closeForm() {

        addCategoryForm.style.display = "none";

        categoryForm.reset();

        categoryImagePreview.innerHTML = "";

        categoryFormMessage.textContent = "";

        editingCategoryId = null;

        editingCategoryImageUrl = null;

        categoryFormTitle.textContent =
            "Add New Category";

        categorySubmitBtn.textContent =
            "✦ Save Category";

    }


    closeCategoryForm.addEventListener(
        "click",
        closeForm
    );


    cancelCategoryForm.addEventListener(
        "click",
        closeForm
    );

    /* =========================
   AUTO GENERATE SLUG
========================= */

const categoryNameInput =
    document.getElementById("categoryName");

const categorySlugInput =
    document.getElementById("categorySlug");

function generateCategorySlug(value) {

    return value
        .toLowerCase()
        .trim()
        .replace(/&/g, " and ")
        .replace(/[^a-z0-9\s-]/g, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-+|-+$/g, "");

}

function escapeHtml(value) {
    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

categoryNameInput.addEventListener(
    "input",
    () => {

        /*
         * Only auto-generate while
         * creating a new category.
         *
         * During edit, existing slug
         * must remain unchanged.
         */

        if (!editingCategoryId) {

            categorySlugInput.value =
                generateCategorySlug(
                    categoryNameInput.value
                );

        }

    }
);

    /* =========================
       IMAGE PREVIEW
    ========================= */

    categoryImage.addEventListener("change", () => {

        categoryImagePreview.innerHTML = "";

        const file =
            categoryImage.files[0];

        if (!file) {
            return;
        }


        const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp"
        ];


        if (!allowedTypes.includes(file.type)) {

            categoryFormMessage.textContent =
                "Please select a JPG, PNG or WEBP image.";

            categoryImage.value = "";

            return;
        }
        
        if (file.size > 5 * 1024 * 1024) {

    categoryFormMessage.textContent =
        "Image must be 5 MB or smaller.";

    categoryImage.value = "";
    categoryImagePreview.innerHTML = "";

    return;
}

        const reader =
            new FileReader();


        reader.onload = (event) => {

            const img =
                document.createElement("img");

            img.src =
                event.target.result;

            img.alt =
                "Category preview";

            categoryImagePreview.appendChild(img);

        };


        reader.readAsDataURL(file);

    });


    /* =========================
       LOAD CATEGORIES
    ========================= */

    async function loadCategories() {
        
        categoriesTableBody.innerHTML = `
            <tr>
                <td colspan="5">
                    <div class="empty-categories">
                        Loading categories...
                    </div>
                </td>
            </tr>
        `;

        try {

            const { data, error } =
                await supabase
                    .from("categories")
                    .select(`
                        id,
                        name,
                        slug,
                        image_url,
                        is_active,
                        display_order
                    `)
                    .order("display_order", {
                        ascending: true
                    })
                    .order("name", {
                        ascending: true
                    });


            if (error) {
                throw error;
            }
            
            allCategories = data || [];

            if (!data || data.length === 0) {

                categoriesTableBody.innerHTML = `
                    <tr>
                        <td colspan="5">
                            <div class="empty-categories">
                                <div class="empty-categories-icon">
                                    ◈
                                </div>

                                <div>
                                    No categories added yet
                                </div>
                            </div>
                        </td>
                    </tr>
                `;

                mobileCategoryList.innerHTML = `
                    <div class="empty-categories mobile-empty-categories">
                        <div class="empty-categories-icon">◈</div>
                        <div>No categories added yet</div>
                    </div>
                `;

                return;
            }

            renderCategories(allCategories);

        } catch (error) {

            console.error(
                "Load categories error:",
                error
            );


            categoriesTableBody.innerHTML = `
                <tr>
                    <td colspan="5">
                        <div class="empty-categories">
                            Unable to load categories.
                        </div>
                    </td>
                </tr>
            `;

            mobileCategoryList.innerHTML = `
                <div class="empty-categories mobile-empty-categories">
                    <div class="empty-categories-icon">!</div>
                    <div>Unable to load categories.</div>
                </div>
            `;

        }

    }

    /* =========================
       EDIT + DELETE BUTTONS
    ========================= */

    categoriesTableBody.addEventListener(
        "click",
        async (event) => {


            /* =====================
               EDIT
            ===================== */

            const editButton =
                event.target.closest(
                    ".edit-category-btn"
                );


            if (editButton) {

                const categoryId =
                    editButton.dataset.id;


                try {

                    categoryFormMessage.textContent =
                        "Loading category...";


                    const { data, error } =
                        await supabase
                            .from("categories")
                            .select(`
                                id,
                                name,
                                slug,
                                description,
                                image_url,
                                is_active,
                                display_order
                            `)
                            .eq("id", categoryId)
                            .single();


                    if (error) {
                        throw error;
                    }
                    editingCategoryId =
                        data.id;

                    editingCategoryImageUrl =
                        data.image_url;


                    document.getElementById(
                        "categoryName"
                    ).value =
                        data.name || "";


                    document.getElementById(
                        "categorySlug"
                    ).value =
                        data.slug || "";


                    document.getElementById(
                        "categoryDescription"
                    ).value =
                        data.description || "";


                    document.getElementById(
                        "categoryDisplayOrder"
                    ).value =
                        data.display_order ?? 0;


                    document.getElementById(
                        "categoryActive"
                    ).checked =
                        data.is_active;


                    categoryImage.value = "";

                    categoryImagePreview.innerHTML =
                        "";


                    if (data.image_url) {

                        const img =
                            document.createElement("img");

                        img.src =
                            data.image_url;

                        img.alt =
                            data.name;

                        categoryImagePreview
                            .appendChild(img);

                    }


                    categoryFormTitle.textContent =
                        "Edit Category";


                    categorySubmitBtn.textContent =
                        "✦ Update Category";


                    categoryFormMessage.textContent =
                        "";


                    addCategoryForm.style.display =
                        "block";


                    addCategoryForm.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });


                } catch (error) {

                    console.error(
                        "Edit category error:",
                        error
                    );


                    categoryFormMessage.textContent =
                        error.message ||
                        "Unable to load category.";
                    showCategoryAlert(
                        error.message || "Unable to load category.",
                        "error",
                        "Unable to Load"
                    );

                }


                return;
            }


            /* =====================
               DELETE
            ===================== */

            const deleteButton =
                event.target.closest(
                    ".delete-category-btn"
                );


            if (!deleteButton) {
                return;
            }


            const categoryId =
                deleteButton.dataset.id;

            const category = allCategories.find(
                item => String(item.id) === String(categoryId)
            );

            const confirmed = await showCategoryConfirm(
                `Delete "${category?.name || "this category"}"?`,
                "This category will be removed from the store."
            );

            if (!confirmed) {
                return;
            }

            try {

                categoryFormMessage.textContent =
                    "Deleting category...";


                const { data: imageUrl, error } =
                    await supabase.rpc(
                        "delete_category",
                        {
                            p_id: categoryId
                        }
                    );


                if (error) {
                    throw error;
                }


                /* =====================
                   DELETE STORAGE IMAGE
                ===================== */

                if (imageUrl) {

                    try {

                        const url =
                            new URL(imageUrl);


                        const marker =
                            "/storage/v1/object/public/categories/";


                        const index =
                            url.pathname.indexOf(
                                marker
                            );


                        if (index !== -1) {

                            const filePath =
                                url.pathname.substring(
                                    index + marker.length
                                );


                            const {
                                error: storageError
                            } =
                                await supabase.storage
                                    .from("categories")
                                    .remove([
                                        filePath
                                    ]);


                            if (storageError) {

                                console.warn(
                                    "Image cleanup failed:",
                                    storageError
                                );

                            }

                        }

                    } catch (storageError) {

                        console.warn(
                            "Unable to process category image:",
                            storageError
                        );

                    }

                }


                categoryFormMessage.textContent =
                    "Category deleted successfully ✨";


                await loadCategories();


                setTimeout(() => {

                    categoryFormMessage.textContent =
                        "";

                }, 1500);


            } catch (error) {

                console.error(
                    "Delete category error:",
                    error
                );


                categoryFormMessage.textContent =
                    error.message ||
                    "Unable to delete category.";
                showCategoryAlert(
                    error.message || "Unable to delete category.",
                    "error",
                    "Delete Failed"
                );

            }

        }
    );


    /* =========================
       MOBILE CATEGORY ACTIONS
    ========================= */

    mobileCategoryList.addEventListener(
        "click",
        (event) => {
            const button =
                event.target.closest(
                    ".edit-category-btn, .delete-category-btn"
                );

            if (!button) {
                return;
            }

            const categoryId = button.dataset.id;

            const desktopButton =
                categoriesTableBody.querySelector(
                    `.${button.classList.contains("edit-category-btn")
                        ? "edit-category-btn"
                        : "delete-category-btn"}[data-id="${categoryId}"]`
                );

            if (desktopButton) {
                desktopButton.click();
            }
        }
    );



    /* =========================
       DELETE CONFIRM ALERT
    ========================= */

    function showCategoryConfirm(title, message) {
        return new Promise(resolve => {
            const stack = document.getElementById("categoryAlertStack");

            if (!stack) {
                resolve(false);
                return;
            }

            const alertEl = document.createElement("div");
            alertEl.className = "category-alert";
            alertEl.innerHTML = `
                <div class="category-alert-icon">!</div>
                <div class="category-alert-content">
                    <div class="category-alert-title">${escapeHtml(title)}</div>
                    <div class="category-alert-message">${escapeHtml(message)}</div>
                </div>
                <div class="category-alert-actions">
                    <button type="button" data-alert-cancel>Cancel</button>
                    <button type="button" class="danger" data-alert-confirm>Delete</button>
                </div>
            `;

            stack.appendChild(alertEl);

            const finish = value => {
                alertEl.remove();
                resolve(value);
            };

            alertEl.querySelector("[data-alert-cancel]")
                .addEventListener("click", () => finish(false));

            alertEl.querySelector("[data-alert-confirm]")
                .addEventListener("click", () => finish(true));
        });
    }

    /* =========================
       SAVE / UPDATE CATEGORY
    ========================= */

    categoryForm.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            const name =
                document.getElementById(
                    "categoryName"
                ).value.trim();


            const slug =
    editingCategoryId
        ? document.getElementById(
              "categorySlug"
          ).value.trim()
        : generateCategorySlug(
              name
          );


            const description =
                document.getElementById(
                    "categoryDescription"
                ).value.trim();


            const isActive =
                document.getElementById(
                    "categoryActive"
                ).checked;


            const displayOrder =
                Number(
                    document.getElementById(
                        "categoryDisplayOrder"
                    ).value || 0
                );


            const file =
                categoryImage.files[0];


            categoryFormMessage.textContent =
                editingCategoryId
                    ? "Updating category..."
                    : "Saving category...";


            try {
                
                const oldImageUrl =
    editingCategoryId
        ? editingCategoryImageUrl
        : null;

                let imageUrl =
                    editingCategoryId
                        ? editingCategoryImageUrl
                        : null;


                /* =====================
                   UPLOAD NEW IMAGE
                ===================== */

                if (file) {

                    const fileExtension =
                        file.name
                            .split(".")
                            .pop()
                            .toLowerCase();


                    const fileName =
                        `${crypto.randomUUID()}.${fileExtension}`;


                    const filePath =
                        `categories/${fileName}`;


                    const {
                        error: uploadError
                    } =
                        await supabase.storage
                            .from("categories")
                            .upload(
                                filePath,
                                file,
                                {
                                    cacheControl: "3600",
                                    upsert: false
                                }
                            );


                    if (uploadError) {
                        throw uploadError;
                    }


                    const {
                        data: publicUrlData
                    } =
                        supabase.storage
                            .from("categories")
                            .getPublicUrl(
                                filePath
                            );


                    imageUrl =
                        publicUrlData.publicUrl;

                }


                /* =====================
                   POSTGRESQL FUNCTION
                ===================== */

                let data;
                let error;


                if (editingCategoryId) {


                    ({
                        data,
                        error
                    } =
                        await supabase.rpc(
                            "update_category",
                            {
                                p_id:
                                    editingCategoryId,

                                p_name:
                                    name,

                                p_slug:
                                    slug,

                                p_description:
                                    description || null,

                                p_image_url:
                                    imageUrl,

                                p_is_active:
                                    isActive,

                                p_display_order:
                                    displayOrder
                            }
                        ));

                } else {

                    ({
                        data,
                        error
                    } =
                        await supabase.rpc(
                            "create_category",
                            {
                                p_name:
                                    name,

                                p_slug:
                                    slug,

                                p_description:
                                    description || null,

                                p_image_url:
                                    imageUrl,

                                p_is_active:
                                    isActive,

                                p_display_order:
                                    displayOrder
                            }
                        ));

                }




                if (error) {
                    throw error;
                }
                
                if (
    editingCategoryId &&
    file &&
    oldImageUrl &&
    oldImageUrl !== imageUrl
) {

    await deleteCategoryStorageImage(
        oldImageUrl
    );

}

                console.log(
                    "Category saved:",
                    data
                );


                showCategoryAlert(
                    editingCategoryId ? "Category updated successfully." : "Category created successfully.",
                    "success",
                    editingCategoryId ? "Category Updated" : "Category Created"
                );

                categoryFormMessage.textContent = "";


                categoryForm.reset();

                categoryImagePreview.innerHTML =
                    "";


                editingCategoryId = null;

                editingCategoryImageUrl = null;


                categoryFormTitle.textContent =
                    "Add New Category";


                categorySubmitBtn.textContent =
                    "✦ Save Category";


                await loadCategories();


                setTimeout(() => {

                    addCategoryForm.style.display =
                        "none";

                    categoryFormMessage.textContent =
                        "";

                }, 1000);


            } catch (error) {

                console.error(
                    "Category save error:",
                    error
                );


                categoryFormMessage.textContent =
                    error.message ||
                    "Unable to save category.";
                showCategoryAlert(
                    error.message || "Unable to save category.",
                    "error",
                    "Save Failed"
                );

            }

        }
    );


    async function deleteCategoryStorageImage(imageUrl) {

    if (!imageUrl) {
        return;
    }

    try {

        const url = new URL(imageUrl);

        const marker =
            "/storage/v1/object/public/categories/";

        const index =
            url.pathname.indexOf(marker);


        if (index === -1) {
            return;
        }


        const filePath =
            url.pathname.substring(
                index + marker.length
            );


        const { error } =
            await supabase.storage
                .from("categories")
                .remove([filePath]);


        if (error) {

            console.warn(
                "Old category image cleanup failed:",
                error
            );

        }

    } catch (error) {

        console.warn(
            "Unable to process old category image:",
            error
        );

    }

}

    function renderCategories(categories) {

    if (!categories || categories.length === 0) {

        categoriesTableBody.innerHTML = `
            <tr>
                <td colspan="5">
                    <div class="empty-categories">
                        <div class="empty-categories-icon">
                            ◈
                        </div>

                        <div>
                            No matching categories found
                        </div>
                    </div>
                </td>
            </tr>
        `;

        mobileCategoryList.innerHTML = `
            <div class="empty-categories mobile-empty-categories">
                <div class="empty-categories-icon">◈</div>
                <div>No matching categories found</div>
            </div>
        `;

        return;
    }


    categoriesTableBody.innerHTML =
        categories.map(category => `

            <tr>

                <td>
                    ${
                        category.image_url
                        ? `<img
                            src="${escapeHtml(category.image_url)}"
                            alt="${escapeHtml(category.name)}"
                            class="category-thumb"
                          >`
                        : `<div class="category-thumb"></div>`
                    }
                </td>

                <td>
                    <span class="category-name">
                        ${escapeHtml(category.name)}
                    </span>
                </td>

                <td>
                    ${escapeHtml(category.slug)}
                </td>

                <td>
                    <span class="status-badge ${
                        category.is_active
                        ? "status-active"
                        : "status-inactive"
                    }">
                        ${
                            category.is_active
                            ? "Active"
                            : "Inactive"
                        }
                    </span>
                </td>

                <td>

                    <button
                        class="action-btn edit-category-btn"
                        type="button"
                        data-id="${category.id}"
                    >
                        Edit
                    </button>

                    <button
                        class="action-btn delete-category-btn"
                        type="button"
                        data-id="${category.id}"
                    >
                        Delete
                    </button>

                </td>

            </tr>

        `).join("");

    mobileCategoryList.innerHTML =
        categories.map(category => `
            <div class="mobile-category-card">

                ${
                    category.image_url
                        ? `<img
                            src="${escapeHtml(category.image_url)}"
                            alt="${escapeHtml(category.name)}"
                            class="mobile-category-image"
                          >`
                        : `<div class="mobile-category-image"></div>`
                }

                <div class="mobile-category-content">

                    <div class="mobile-category-top">
                        <div>
                            <h3 class="mobile-category-name">
                                ${escapeHtml(category.name)}
                            </h3>

                            <p class="mobile-category-slug">
                                ${escapeHtml(category.slug)}
                            </p>
                        </div>

                        <span class="status-badge ${
                            category.is_active
                                ? "status-active"
                                : "status-inactive"
                        }">
                            ${
                                category.is_active
                                    ? "Active"
                                    : "Inactive"
                            }
                        </span>
                    </div>

                    ${
                        category.description
                            ? `<p class="mobile-category-description">
                                ${escapeHtml(category.description)}
                               </p>`
                            : ""
                    }

                    <div class="mobile-category-meta">
                        <span>
                            Order: ${category.display_order ?? 0}
                        </span>
                    </div>

                    <div class="mobile-category-actions">

                        <button
                            type="button"
                            class="edit-category-btn"
                            data-id="${category.id}"
                        >
                            Edit
                        </button>

                        <button
                            type="button"
                            class="delete-category-btn delete"
                            data-id="${category.id}"
                        >
                            Delete
                        </button>

                    </div>

                </div>
            </div>
        `).join("");

}

categorySearch.addEventListener("input", () => {

    const searchTerm =
        categorySearch.value
            .trim()
            .toLowerCase();


    if (!searchTerm) {

        renderCategories(allCategories);

        return;
    }


    const filteredCategories =
        allCategories.filter(category => {

            const name =
                (category.name || "")
                    .toLowerCase();

            const slug =
                (category.slug || "")
                    .toLowerCase();


            return (
                name.includes(searchTerm) ||
                slug.includes(searchTerm)
            );

        });


    renderCategories(filteredCategories);

});

    /* =========================
       INITIAL LOAD
    ========================= */

    loadCategories();

});

</script>
<script type="module">

    import { supabase }
        from "./supabase-client.js";


    /* =====================================================
       LOAD NAVIGATION
       ===================================================== */

    document.addEventListener(
        "DOMContentLoaded",
        async () => {

            const navigationContainer =
                document.getElementById(
                    "admin-navigation"
                );

            if (!navigationContainer) {
                return;
            }


            try {

                const response =
                    await fetch(
                        "admin-navigation.html"
                    );

                if (!response.ok) {
                    throw new Error(
                        "Navigation could not be loaded."
                    );
                }


                const navigationHTML =
                    await response.text();


                navigationContainer.innerHTML =
                    navigationHTML;


                /* =================================================
                   ACTIVE NAVIGATION
                   ================================================= */

                const currentPage =
                    document.body.dataset.adminPage;


                if (currentPage) {

                    const activeItem =
                        navigationContainer.querySelector(
                            `.nav-item[data-page="${currentPage}"]`
                        );


                    if (activeItem) {

                        activeItem.classList.add(
                            "active"
                        );

                    }

                }


                /* =================================================
                   ADMIN DROPDOWN
                   ================================================= */

                const adminProfile =
                    document.getElementById(
                        "adminProfile"
                    );

                const adminProfileTrigger =
                    document.getElementById(
                        "adminProfileTrigger"
                    );

                const adminProfileMenu =
                    document.getElementById(
                        "adminProfileMenu"
                    );


                if (
                    adminProfile &&
                    adminProfileTrigger &&
                    adminProfileMenu
                ) {

                    adminProfileTrigger.addEventListener(
                        "click",
                        (event) => {

                            event.stopPropagation();


                            const isOpen =
                                adminProfile.classList.toggle(
                                    "open"
                                );


                            adminProfileTrigger.setAttribute(
                                "aria-expanded",
                                isOpen
                                    ? "true"
                                    : "false"
                            );

                        }
                    );


                    adminProfileMenu.addEventListener(
                        "click",
                        (event) => {
                            event.stopPropagation();
                        }
                    );


                    document.addEventListener(
                        "click",
                        () => {

                            adminProfile.classList.remove(
                                "open"
                            );


                            adminProfileTrigger.setAttribute(
                                "aria-expanded",
                                "false"
                            );

                        }
                    );

                }


                /* =================================================
                   LOGOUT
                   ================================================= */

                const logoutBtn =
                    document.getElementById(
                        "logoutBtn"
                    );


                if (logoutBtn) {

                    logoutBtn.addEventListener(
                        "click",
                        async () => {

                            logoutBtn.disabled =
                                true;


                            logoutBtn.innerHTML = `
                                <span>↪</span>
                                <span>Logging out...</span>
                            `;


                            try {

                                const {
                                    error
                                } =
                                    await supabase
                                        .auth
                                        .signOut();


                                if (error) {
                                    throw error;
                                }


                                window.location.href =
                                    "index.html";


                            } catch (error) {

                                console.error(
                                    "Logout failed:",
                                    error
                                );


                                logoutBtn.disabled =
                                    false;


                                logoutBtn.innerHTML = `
                                    <span>↪</span>
                                    <span>Logout</span>
                                `;


                                alert(
                                    "Unable to logout. Please try again."
                                );

                            }

                        }
                    );

                }


            } catch (error) {

                console.error(
                    "Failed to load admin navigation:",
                    error
                );

            }

        }
    );

</script>
